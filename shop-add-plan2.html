<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>新增商铺（方案2）</title>
  <link rel="stylesheet" href="assets/styles.css" />
  <style>
    .req:after{content:' *';color:var(--danger)}
    .sub{border:1px solid var(--border);border-radius:10px;background:#fff;padding:12px;margin-top:12px}
    .form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
    .phone-split{display:flex;gap:8px}.phone-split .area{flex:0 0 34%}.phone-split .number{flex:1}
    .svc-row{display:flex;gap:16px;flex-wrap:wrap}.svc-row label{display:inline-flex;align-items:center;gap:6px}
    .muted-box{border:1px dashed var(--border);min-height:34px;border-radius:6px;display:flex;align-items:center;padding:0 10px;color:var(--muted);background:var(--panel-2)}
    .hidden{display:none}
    .modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.38);display:none;align-items:center;justify-content:center;z-index:1300}
    .modal{width:min(1080px,calc(100vw - 40px));background:var(--panel);border:1px solid var(--border);border-radius:10px}
    .modal-hd,.modal-ft{padding:12px 16px;border-bottom:1px solid var(--border)}
    .modal-ft{border-top:1px solid var(--border);border-bottom:0;text-align:right}
    .modal-bd{padding:12px 16px;max-height:66vh;overflow:auto}
    .search-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:10px}
    .channel-list{display:grid;gap:10px;margin:6px 0}.channel-item{display:flex;align-items:center;gap:8px}
    .mid-modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  </style>
</head>
<body>
<header class="shell-top"><div class="logo-area"><div class="logo">K</div><a href="shop-list.html">Kpay CRM</a></div><div class="top-controls"><select><option>地区：香港</option><option>地区：新加坡</option></select><select><option>语言：简体中文</option><option>English</option></select><button title="设置">⚙️</button><button title="通知">🔔</button><div class="user-pill"><div class="avatar">OP</div> Olivia</div></div></header>
<div class="layout"><aside class="sidebar" id="appSidebar"></aside>
<main class="main with-bottom-space">
  <section class="card">
    <div class="card-h"><h3 class="section-title">新增商铺</h3></div>
    <div class="sub">
      <div class="form-grid">
        <div class="field"><label class="req">商铺类型</label><select id="shopType"><option value="">请选择商铺类型</option><option value="individual">个体户</option><option value="enterprise">企业</option></select></div>
        <div class="field"><label class="req">商铺名称</label><input id="shopName" /></div>
        <div class="field"><label class="req">门店类型</label><select><option>线下门店</option><option>线上店</option><option>混合</option></select></div>
      </div>
    </div>

    <div id="enterpriseBlock" class="sub hidden">
      <h3 class="section-title">关联企业信息</h3>
      <div class="inline-actions"><button class="btn" id="chooseEnterpriseBtn">选择企业</button></div>
      <p class="desc">新增商铺必须先关联企业；仅支持弹窗列表选择，不支持普通下拉选择。</p>
      <div class="form-grid">
        <div class="field"><label class="req">CID</label><div class="muted-box" id="enterpriseCid">未选择</div></div>
        <div class="field"><label>企业名称</label><div class="muted-box" id="enterpriseName">未选择</div></div>
        <div class="field"><label>企业营业状态</label><div class="muted-box" id="enterpriseStatus">未选择</div></div>
        <div class="field"><label>企业类型</label><div class="muted-box" id="enterpriseType">未选择</div></div>
        <div class="field"><label>所属地区</label><div class="muted-box" id="enterpriseRegion">未选择</div></div>
        <div class="field"><label>关联群组</label><div class="muted-box" id="enterpriseGroup">未选择</div></div>
      </div>
    </div>

    <div class="sub">
      <label class="req">开通KPay服务</label>
      <div class="svc-row" id="shopServices">
        <label><input type="checkbox" data-svc="SaaS" disabled> SaaS</label>
        <label><input type="checkbox" data-svc="payment" disabled> payment</label>
        <label><input type="checkbox" data-svc="KBA" disabled> KBA</label>
      </div>
    </div>

    <div id="serviceSections"></div>
  </section>
</main></div>

<div class="modal-mask" id="enterpriseModal"><div class="modal"><div class="modal-hd"><strong>选择企业</strong></div><div class="modal-bd">
  <div class="search-grid"><input id="filterCid" placeholder="CID" /><input id="filterName" placeholder="企业名称" /><select id="filterStatus"><option value="">企业营业状态</option><option>正常营业</option><option>暂停营业</option></select><select id="filterType"><option value="">企业类型</option><option>企業商戶</option><option>个体户</option></select></div>
  <div class="table-wrap"><table><thead><tr><th>CID</th><th>企业名称</th><th>企业营业状态</th><th>企业类型</th><th>所属地区</th><th>关联群组</th><th>操作</th></tr></thead><tbody id="enterpriseRows"></tbody></table></div>
</div><div class="modal-ft"><button class="btn" id="closeEnterpriseModal">关闭</button></div></div></div>

<div class="modal-mask" id="deviceModal"><div class="modal"><div class="modal-hd"><strong>选择设备</strong></div><div class="modal-bd"><div class="search-grid" style="grid-template-columns:repeat(2,minmax(0,1fr));"><input id="deviceModelKeyword" placeholder="按设备型号搜索"><input id="deviceSnKeyword" placeholder="按设备序列号搜索"></div><div class="table-wrap"><table><thead><tr><th>设备型号</th><th>设备分类</th><th>设备序列号</th><th>状态</th><th>操作</th></tr></thead><tbody id="deviceRows"></tbody></table></div></div><div class="modal-ft"><button class="btn" id="closeDeviceModal">关闭</button></div></div></div>
<div class="modal-mask" id="midChannelModal"><div class="modal" style="max-width:760px;"><div class="modal-hd"><strong>选择服务与通道</strong></div><div class="modal-bd"><div class='mid-modal-grid'><div><h5>服务</h5><div id='midServiceList' class='channel-list'></div></div><div id='midChannelPane'><h5>通道</h5><div class="channel-list"><label class="channel-item"><input type="checkbox" class="mid-channel" value="Adyen_payfac">Adyen_payfac</label><label class="channel-item"><input type="checkbox" class="mid-channel" value="Adyen_AFP">Adyen_AFP</label><label class="channel-item"><input type="checkbox" class="mid-channel" value="VISA">VISA</label></div></div></div></div><div class="modal-ft"><button class="btn" id="closeMidModal">取消</button><button class="btn primary" id="confirmMidChannel">确认</button></div></div></div>
<div class="modal-mask" id="peopleModal"><div class="modal" style="max-width:860px;"><div class="modal-hd"><strong>新增相关人员</strong></div><div class="modal-bd"><div class="form-grid"><div class="field"><label class="req">中文姓</label><input id="p_cn_last"></div><div class="field"><label class="req">中文名</label><input id="p_cn_first"></div><div class="field"><label>英文姓</label><input id="p_en_last"></div><div class="field"><label>英文名</label><input id="p_en_first"></div><div class="field"><label>当地语言姓</label><input id="p_local_last"></div><div class="field"><label>当地语言名</label><input id="p_local_first"></div><div class="field"><label>曾用名</label><input id="p_former_name"></div><div class="field"><label class="req">角色身份类型</label><select id="p_role"><option value="">请选择</option><option>董事</option><option>股东</option><option>总经理</option><option>利益用有人</option><option>合伙人</option><option>相关人士</option><option>联络人</option><option>技术联络人</option><option>其他</option></select></div><div class="field"><label class="req">是否主联系人</label><select id="p_primary"><option>是</option><option>否</option></select></div><div class="field"><label>电话</label><input id="p_phone"></div><div class="field"><label>邮箱</label><input id="p_email"></div></div><div id="p_role_extra" class="form-grid" style="margin-top:10px;"></div></div><div class="modal-ft"><button class="btn" id="closePeopleModal">取消</button><button class="btn primary" id="savePersonBtn">保存</button></div></div></div>
<div class="modal-mask" id="personModal"><div class="modal"><div class="modal-hd"><strong>选择已有人员</strong></div><div class="modal-bd"><div class="search-grid" style="grid-template-columns:repeat(4,minmax(0,1fr));"><input id="personIdKeyword" placeholder="人员ID"><input id="personNameKeyword" placeholder="姓名"><input id="personPhoneKeyword" placeholder="电话"><input id="personEmailKeyword" placeholder="邮箱"></div><div class="table-wrap"><table><thead><tr><th>人员ID</th><th>姓名</th><th>角色身份类型</th><th>电话</th><th>邮箱</th><th>操作</th></tr></thead><tbody id="personRows"></tbody></table></div></div><div class="modal-ft"><button class="btn" id="closePersonModal">关闭</button></div></div></div>

<script src="assets/app.js"></script>
<script>
renderGlobalSidebar('appSidebar','shop-add-plan2.html');
const enterprises=[{ cid:'CID-2026-0004', name:'Everpeak Digital Commerce', status:'正常营业', type:'企業商戶', region:'香港', group:'跨境电商, 高风险行业' }];
const peoplePool=[{ id:'P-10009', name:'陈一鸣', role:'负责人', primary:'是', phone:'+852-6666-8899', email:'owner@everpeak.hk' }];
const devicePool=[{model:'V400m',category:'POS',serial:'SN-900001',status:'库存可分配'}];
const shop={type:'',enterprise:null,services:[],mids:[],devices:[],people:[]};

const shopSectionDefs={ saas:[['商铺名称',['商铺当地语言名称*','商铺当地语言简称','商铺英文名称','商铺英文简称']],['商铺联系',['商铺固定电话*','商铺手提电话*','商铺电邮地址*','商铺管理员电邮','商铺运营电邮','联络语言']],['商铺地址',['主要营业地址（当地语言）*','主要营业地址（英文）','营业铺位','营业国家*','营业地区*','门店地址-城市*','门店地址-地址行1*','门店地址-地址行2','门店地址-地址行3','邮政编码']],['SaaS 门店运营配置（演示字段）',['是否启用商品管理','是否启用出单服务','是否启用桌面扫码点餐','是否对接第三方点餐平台','第三方点餐平台名称*','门店营业时间','堂食 / 外卖 / 自取','默认打印语言','自动打印订单','是否需要菜品初始化']],['相关人员',['姓名*','角色身份类型*','是否主联系人*','电话*','邮箱*']]],payment:[['商铺基础',['开通KPay服务*','店面相片*','存仓相片','租金','租约年期','私隐政策','产品目录','送货政策','门店类型*','联络语言','商户营业状态*','特殊业务属性标签','退货政策','退货政策截图','审核类型*','上单来源*','服务类型*','合作伙伴推荐人','合作伙伴编号','交单备注','是否高额商户','是否首次申请卡机商户','申请过的卡机品牌','商户预计使用KPay业务占比','重复签约原因']],['商铺名称',['商铺当地语言名称*','商铺当地语言简称','商铺英文名称','商铺英文简称','商铺第三语言名称','商铺第三语言简称','商铺其它名称','商铺所有名称（当地语言）','商铺所有名称（英文）','切换商铺显示名称（中文）','切换商铺显示名称（英文）']],['商铺联系',['商铺固定电话*','商铺手提电话*','商铺电邮地址*','商铺管理员电邮','商铺运营电邮','商铺接收营销资讯','商铺微信ID','接收营销资讯']],['商铺地址',['主要营业地址（当地语言）*','主要营业地址（英文）','营业铺位','营业国家*','营业地区*','门店地址-城市*','门店地址-州/省','门店地址-地址行1*','门店地址-地址行2','门店地址-地址行3','邮寄地址','邮政编码']],['线上资料',['Website(Desktop)','Website(Mobile)','APP(Android)','APP(IOS)','Facebook','Instagram','Openrice','H5经营网址']],['商铺文件',['租约证明','商铺LOGO','营业环境照片三张*','营业地址证明*','营业牌照','入货单','闭路电视录像','最高交易金额的客户单据','商业登记证号码','商业登记证名称','证书有效期','商业登记证副本照片','重复签约证明附件','商业登记册内资料电子摘录']],['门店经营特征',['每宗交易平均金额*','每宗交易最大交易额*','预计每年交易宗数*','过往拒付比例','拒付平均处理日数','过往退款比例','退款平均处理日数','平均每月营业额*','经营方式*','提前收款日数','货物/服务最短送达时间','货物/服务最长送达时间','行业分类*','业务性质*','产品服务*','小费功能']],['结算与银行信息',['结算周期*','结算币种*','NP结算周期','打款银行','结算摘要前缀','卡类型','FPS账号','收款银行账户名称*','银行名称*','银行号码*','银行编号','结算身份证号','银行卡归属国*','银行卡归属省','一份银行户口月结单（最近三个月内银行发出的）*','FPS-DBS申请文件']],['相关人员',['姓名*','角色身份类型*','是否主联系人*','电话*','邮箱*']],['其他信息',['风控类型*','合约开始日期','合约结束日期']]] };

function fieldInput(label){const n=label.replace('*','');if(/相片|截图|证明|目录|政策|附件|文件|照片/.test(n))return "<input type='file'/>";if(/是否/.test(n))return "<select><option>否</option><option>是</option></select>";if(/邮箱|电邮/.test(n))return "<input type='email'/>";if(/电话/.test(n))return "<div class='phone-split'><input class='area' placeholder='输入区号'/><input class='number' placeholder='输入电话号码'/></div>";if(/金额|租金|占比|数量|交易/.test(n))return "<input type='number'/>";if(/日期/.test(n))return "<input type='date'/>";if(/国家|地区|类型|身份|语言|状态|方式|分类|服务|来源|品牌|周期|币种|银行|角色/.test(n))return "<select><option>请选择</option></select>";return "<input/>";}
function renderServiceSections(){const keys=[];if(shop.services.includes('SaaS'))keys.push('saas');if(shop.services.includes('payment'))keys.push('payment');const host=document.getElementById('serviceSections');if(!keys.length){host.innerHTML='';return;}const merged=[];keys.forEach(k=>shopSectionDefs[k].forEach(([t,fs])=>merged.push([t,fs])));host.innerHTML=merged.map(([title,fs])=>`<div class='sub'><h4>${title}</h4><div class='form-grid'>${fs.map(f=>`<div class='field'><label class='${f.includes('*')?'req':''}'>${f.replace('*','')}</label>${fieldInput(f)}</div>`).join('')}</div></div>`).join('')+renderMidArea()+renderPeopleArea();bindDynamicActions();}
function renderMidArea(){return `<div class='sub'><h4>商户（MID）信息区</h4><button class='btn' id='addMidBtn'>新增 MID</button><div id='midList'>${shop.mids.length?shop.mids.map((m,i)=>`<div class='sub'><div style='display:flex;justify-content:space-between;align-items:center;'><strong>${m.id}</strong><div><button class='btn' data-mid-copy='${i}'>复制</button> <button class='btn' data-mid-del='${i}'>删除</button></div></div><p class='muted'>服务：${m.services.join('、')||'-'} ｜ 通道：${m.channels.join('、')||'-'}</p>${renderMidRateArea(m,i)}${renderMidSettleArea(m,i)}${renderMidDeviceArea(m,i)}</div>`).join(''):"<p class='muted'>暂无 MID，请点击“新增 MID”。</p>"}</div></div>`;}
function renderMidRateArea(mid,idx){if(!mid.services.includes('payment'))return '';return `<div class='sub'><h5>产品费率区</h5><div class='form-grid'><div class='field'><label class='req'>银行卡类型</label><select data-mid-idx='${idx}' data-k='cardType'><option value=''>请选择</option><option value='Credit'>Credit</option><option value='Debit'>Debit</option></select></div><div class='field'><label class='req'>费率类型</label><select data-mid-idx='${idx}' data-k='rateType'><option value=''>请选择</option><option value='百分比'>百分比</option><option value='固定金额'>固定金额</option></select></div><div class='field'><label class='req'>费率值</label><input data-mid-idx='${idx}' data-k='rateValue' value='${mid.rateValue||''}' placeholder='例如 2.5 或 3.00'></div></div></div>`;}
function renderMidSettleArea(mid,idx){const mode=mid.settleMode||'';return `<div class='sub'><h5>结算与银行信息区</h5><div class='form-grid'><div class='field'><label class='req'>结算模式</label><select data-mid-idx='${idx}' data-k='settleMode'><option value=''>请选择</option><option value='inherit' ${mode==='inherit'?'selected':''}>继承企业结算信息</option><option value='manual' ${mode==='manual'?'selected':''}>手动录入结算信息</option><option value='fps' ${mode==='fps'?'selected':''}>FPS 结算</option></select></div>${mode==='manual'?`<div class='field'><label class='req'>收款银行账户名称</label><input data-mid-idx='${idx}' data-k='acctName' value='${mid.acctName||''}'></div><div class='field'><label class='req'>银行名称</label><input data-mid-idx='${idx}' data-k='bankName' value='${mid.bankName||''}'></div><div class='field'><label class='req'>银行号码</label><input data-mid-idx='${idx}' data-k='bankNo' value='${mid.bankNo||''}'></div><div class='field'><label>银行编号</label><input data-mid-idx='${idx}' data-k='bankCode' value='${mid.bankCode||''}'></div>`:''}${mode==='fps'?`<div class='field'><label class='req'>FPS账号</label><input data-mid-idx='${idx}' data-k='fpsId' value='${mid.fpsId||''}'></div><div class='field'><label class='req'>FPS-DBS申请文件</label><input type='file'></div>`:''}</div></div>`;}
function renderMidDeviceArea(mid,idx){if(!mid.services.includes('payment'))return '';return `<div class='sub'><h5>管理设备区</h5><div class='inline-actions'><button class='btn' data-open-device='${idx}'>关联设备</button></div><div class='table-wrap' style='margin-top:8px;'><table><thead><tr><th>设备序列号</th><th>数量</th><th>支付金额</th><th>操作</th></tr></thead><tbody>${(mid.devices||[]).length?(mid.devices||[]).map((d,di)=>`<tr><td>${d.serial}</td><td><input data-mid-idx='${idx}' data-device-idx='${di}' data-k='qty' value='${d.qty||1}'></td><td><input data-mid-idx='${idx}' data-device-idx='${di}' data-k='amt' value='${d.amt||''}'></td><td><button class='btn' data-mid-device-del='${idx}-${di}'>删除</button></td></tr>`).join(''):`<tr><td colspan='4'>暂无已关联设备</td></tr>`}</tbody></table></div></div>`;}
function renderPeopleArea(){return `<div class='sub'><h4>相关人员</h4><div class='inline-actions'><button class='btn' id='addPersonBtn'>新增相关人员</button><button class='btn' id='pickPersonBtn'>选择已有人员</button></div><div class='table-wrap' style='margin-top:10px;'><table><thead><tr><th>姓名</th><th>角色身份类型</th><th>是否主联系人</th><th>电话</th><th>邮箱</th><th>操作</th></tr></thead><tbody>${shop.people.length?shop.people.map((p,i)=>`<tr><td>${p.name}</td><td>${p.role}</td><td>${p.primary}</td><td>${p.phone}</td><td>${p.email}</td><td><button class='btn' data-person-del='${i}'>删除</button></td></tr>`).join(''):"<tr><td colspan='6'>暂无相关人员</td></tr>"}</tbody></table></div></div>`;}
function bindDynamicActions(){document.getElementById('addMidBtn')?.addEventListener('click',openMidModal);document.querySelectorAll('[data-mid-del]').forEach(b=>b.onclick=()=>{shop.mids.splice(Number(b.dataset.midDel),1);renderServiceSections();});document.querySelectorAll('[data-mid-copy]').forEach(b=>b.onclick=()=>{const x=JSON.parse(JSON.stringify(shop.mids[Number(b.dataset.midCopy)]));x.id='MID-TMP-'+(shop.mids.length+1);shop.mids.push(x);renderServiceSections();});document.querySelectorAll('[data-open-device]').forEach(b=>b.onclick=()=>{activeMidIdx=Number(b.dataset.openDevice);renderDeviceRows();document.getElementById('deviceModal').style.display='flex';});document.querySelectorAll('[data-mid-device-del]').forEach(b=>b.onclick=()=>{const [mi,di]=b.dataset.midDeviceDel.split('-').map(Number);shop.mids[mi].devices.splice(di,1);renderServiceSections();});document.querySelectorAll('[data-mid-idx][data-k]').forEach(el=>el.oninput=()=>{const mi=Number(el.dataset.midIdx);const key=el.dataset.k;if(el.tagName==='SELECT')shop.mids[mi][key]=el.value;else if(el.dataset.deviceIdx!==undefined){const di=Number(el.dataset.deviceIdx);shop.mids[mi].devices[di][key]=el.value;}else shop.mids[mi][key]=el.value; if(key==='settleMode')renderServiceSections();});document.getElementById('addPersonBtn')?.addEventListener('click',()=>document.getElementById('peopleModal').style.display='flex');document.getElementById('pickPersonBtn')?.addEventListener('click',()=>{renderPersonRows();document.getElementById('personModal').style.display='flex';});document.querySelectorAll('[data-person-del]').forEach(b=>b.onclick=()=>{shop.people.splice(Number(b.dataset.personDel),1);renderServiceSections();});}

function refreshServiceEnabled(){const type=document.getElementById('shopType').value;const allow=type==='individual'||(type==='enterprise'&&shop.enterprise);document.querySelectorAll('#shopServices input').forEach(x=>{x.disabled=!allow;if(!allow)x.checked=false;});if(!allow){shop.services=[];renderServiceSections();}}

let activeMidIdx=-1;
function openMidModal(){const host=document.getElementById('midServiceList');host.innerHTML=['SaaS','payment','KBA'].filter(s=>shop.services.includes(s)).map(s=>`<label class='channel-item'><input type='checkbox' class='mid-service' value='${s}'>${s}</label>`).join('');document.querySelectorAll('.mid-channel').forEach(x=>x.checked=false);document.getElementById('midChannelModal').style.display='flex';}

document.getElementById('confirmMidChannel').onclick=()=>{const services=[...document.querySelectorAll('.mid-service:checked')].map(x=>x.value);if(!services.length)return alert('请至少选择一个服务');const channels=[...document.querySelectorAll('.mid-channel:checked')].map(x=>x.value);shop.mids.push({id:'MID-TMP-'+(shop.mids.length+1),services,channels,devices:[]});document.getElementById('midChannelModal').style.display='none';renderServiceSections();};

document.getElementById('shopType').addEventListener('change',e=>{shop.type=e.target.value;document.getElementById('enterpriseBlock').classList.toggle('hidden',shop.type!=='enterprise');if(shop.type!=='enterprise')shop.enterprise=null;refreshServiceEnabled();});
document.querySelectorAll('#shopServices input').forEach(x=>x.addEventListener('change',()=>{shop.services=[...document.querySelectorAll('#shopServices input:checked')].map(i=>i.dataset.svc);renderServiceSections();}));

function renderEnterpriseRows(){const host=document.getElementById('enterpriseRows');host.innerHTML=enterprises.map(e=>`<tr><td>${e.cid}</td><td>${e.name}</td><td>${e.status}</td><td>${e.type}</td><td>${e.region}</td><td>${e.group}</td><td><button class='btn' data-cid='${e.cid}'>选择</button></td></tr>`).join('');host.querySelectorAll('[data-cid]').forEach(b=>b.onclick=()=>{shop.enterprise=enterprises.find(x=>x.cid===b.dataset.cid);['Cid','Name','Status','Type','Region','Group'].forEach(k=>document.getElementById('enterprise'+k).textContent=shop.enterprise[{Cid:'cid',Name:'name',Status:'status',Type:'type',Region:'region',Group:'group'}[k]]);document.getElementById('enterpriseModal').style.display='none';refreshServiceEnabled();});}
function renderDeviceRows(){const host=document.getElementById('deviceRows');host.innerHTML=devicePool.map(d=>`<tr><td>${d.model}</td><td>${d.category}</td><td>${d.serial}</td><td>${d.status}</td><td><button class='btn' data-serial='${d.serial}'>选择</button></td></tr>`).join('');host.querySelectorAll('[data-serial]').forEach(b=>b.onclick=()=>{if(activeMidIdx<0)return;shop.mids[activeMidIdx].devices.push({serial:b.dataset.serial});document.getElementById('deviceModal').style.display='none';renderServiceSections();});}
function renderPersonRows(){const host=document.getElementById('personRows');host.innerHTML=peoplePool.map(p=>`<tr><td>${p.id}</td><td>${p.name}</td><td>${p.role}</td><td>${p.phone}</td><td>${p.email}</td><td><button class='btn' data-pid='${p.id}'>选择</button></td></tr>`).join('');host.querySelectorAll('[data-pid]').forEach(b=>b.onclick=()=>{const p=peoplePool.find(x=>x.id===b.dataset.pid);shop.people.push({name:p.name,role:p.role,primary:p.primary,phone:p.phone,email:p.email});document.getElementById('personModal').style.display='none';renderServiceSections();});}
function renderRoleExtra(){const role=(document.getElementById('p_role').value||'').trim();const host=document.getElementById('p_role_extra');if(!host)return;const certRoles=new Set(['董事','股东','总经理','合伙人','相关人士']);if(certRoles.has(role)){host.innerHTML=\"<div class='field'><label class='req'>国籍</label><input id='p_nationality'></div><div class='field'><label class='req'>证件号码</label><input id='p_id_number'></div><div class='field'><label class='req'>证件有效期</label><input id='p_id_validity'></div><div class='field'><label class='req'>证件照片</label><input id='p_id_image' type='file'></div><div class='field'><label class='req'>签发日期</label><input id='p_id_issue_date' type='date'></div><div class='field'><label class='req'>签发国家</label><input id='p_visa_country'></div><div class='field'><label class='req'>签发地点</label><input id='p_visa_place'></div>\";return;}if(role==='联络人'){host.innerHTML=\"<div class='field'><label class='req'>部门</label><input id='p_contact_department'></div><div class='field'><label class='req'>职位</label><input id='p_contact_title'></div><div class='field'><label class='req'>常用语言</label><input id='p_contact_language'></div>\";return;}host.innerHTML='';}

document.getElementById('chooseEnterpriseBtn').onclick=()=>{renderEnterpriseRows();document.getElementById('enterpriseModal').style.display='flex';};
document.getElementById('closeEnterpriseModal').onclick=()=>document.getElementById('enterpriseModal').style.display='none';
document.getElementById('closeMidModal').onclick=()=>document.getElementById('midChannelModal').style.display='none';
document.getElementById('closeDeviceModal').onclick=()=>document.getElementById('deviceModal').style.display='none';
document.getElementById('closePeopleModal').onclick=()=>document.getElementById('peopleModal').style.display='none';
document.getElementById('closePersonModal').onclick=()=>document.getElementById('personModal').style.display='none';
document.getElementById('p_role').addEventListener('change',renderRoleExtra);
document.getElementById('savePersonBtn').onclick=()=>{const role=(document.getElementById('p_role').value||'').trim();const name=(document.getElementById('p_cn_last').value+document.getElementById('p_cn_first').value).trim();if(!name||!role)return alert('请完整填写相关人员必填字段');const certRoles=new Set(['董事','股东','总经理','合伙人','相关人士']);if(certRoles.has(role)){const required=['p_nationality','p_id_number','p_id_validity','p_id_image','p_id_issue_date','p_visa_country','p_visa_place'];for(const id of required){const el=document.getElementById(id);const v=el?.type==='file'?(el.files&&el.files.length):(el?.value||'').trim();if(!v)return alert('当前角色需填写完整证件信息');}}if(role==='联络人'){const required=['p_contact_department','p_contact_title','p_contact_language'];for(const id of required){if(!(document.getElementById(id)?.value||'').trim())return alert('当前角色需填写联络人扩展信息');}}shop.people.push({name,role,primary:document.getElementById('p_primary').value,phone:document.getElementById('p_phone').value,email:document.getElementById('p_email').value});document.getElementById('peopleModal').style.display='none';renderServiceSections();};
</script>
</body>
</html>
