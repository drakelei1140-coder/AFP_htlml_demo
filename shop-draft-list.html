<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>商铺草稿列表</title><link rel="stylesheet" href="assets/styles.css"/></head><body><header class="shell-top"><div class="logo-area"><div class="logo">K</div><a href="shop-list.html">Kpay CRM</a></div></header><div class="layout"><aside class="sidebar" id="appSidebar"></aside><main class="main"><section class="card"><h3 class="section-title">筛选区</h3><div class="grid-3"><div class="field"><label>名称关键词</label><input id="name"/></div><div class="field"><label>地区</label><select id="region"><option value="">全部</option><option>香港</option><option>新加坡</option><option>澳门</option></select></div></div><div class="btns"><button class="btn primary" onclick="render()">查询</button></div></section><section class="card"><h3 class="section-title">列表区（最多50条）</h3><div class="table-wrap"><table><thead><tr><th>商铺名称</th><th>商铺编号</th><th>所属企业名称</th><th>所属企业编号（CID）</th><th>地区</th><th>服务通道</th><th>商铺类型</th><th>经营模式</th><th>MCC Code</th><th>商铺电话</th><th>管理员电邮</th><th>上單來源</th><th>创建人</th><th>创建时间</th><th>更新时间</th><th>操作</th></tr></thead><tbody id="tb"></tbody></table></div></section></main></div><script src="assets/app.js"></script><script>const K='draft_shop_v1',SEED=[{id:'SHOP-D-001',name:'Everpeak Central Draft',enterpriseName:'Everpeak Digital Commerce',cid:'CID-2026-0004',region:'香港',service:'Adyen-AFP',type:'线下门店',mode:'直营',mcc:'5651',phone:'+852-2111-1000',email:'ops.central@ever.hk',source:'CRM',creator:'Olivia',createdAt:'2026-05-01',updatedAt:'2026-05-05'},{id:'SHOP-D-002',name:'Blue Online Draft',enterpriseName:'Blue Harbor',cid:'CID-2026-0002',region:'新加坡',service:'Adyen-payfac',type:'线上商铺',mode:'联营',mcc:'5812',phone:'+65-6000-2211',email:'risk@blue.sg',source:'SaaS',creator:'Jay',createdAt:'2026-05-01',updatedAt:'2026-05-04'},{id:'SHOP-D-003',name:'Nova AFP Draft',enterpriseName:'Nova Retail',cid:'CID-2026-0001',region:'香港',service:'Adyen-AFP',type:'线上商铺',mode:'直营',mcc:'5947',phone:'+852-2333-0101',email:'api@nova.com',source:'External-API',creator:'Mina',createdAt:'2026-04-30',updatedAt:'2026-05-03'},{id:'SHOP-D-004',name:'Everpeak TST Draft',enterpriseName:'Everpeak Digital Commerce',cid:'CID-2026-0004',region:'香港',service:'Adyen-payfac',type:'线下门店',mode:'直营',mcc:'5651',phone:'+852-2999-8800',email:'manager.tst@ever.hk',source:'CRM',creator:'Ivy',createdAt:'2026-04-29',updatedAt:'2026-05-02'},{id:'SHOP-D-005',name:'Aster Campus Draft',enterpriseName:'Aster Kids',cid:'CID-2026-0006',region:'澳门',service:'Adyen-AFP',type:'线下门店',mode:'直营',mcc:'8299',phone:'+853-6222-7788',email:'admin@aster.mo',source:'SaaS',creator:'Nana',createdAt:'2026-04-28',updatedAt:'2026-05-01'}];function get(){const d=JSON.parse(localStorage.getItem(K)||'[]');if(!d.length){localStorage.setItem(K,JSON.stringify(SEED));return SEED;}return d;}function render(){const n=document.getElementById('name').value.toLowerCase(),r=document.getElementById('region').value;const rows=get().filter(x=>(!n||(x.name||'').toLowerCase().includes(n))&&(!r||x.region===r));document.getElementById('tb').innerHTML=rows.map(x=>`<tr><td>${x.name||''}</td><td>${x.id||''}</td><td>${x.enterpriseName||''}</td><td>${x.cid||''}</td><td>${x.region||''}</td><td>${x.service||''}</td><td>${x.type||''}</td><td>${x.mode||''}</td><td>${x.mcc||''}</td><td>${x.phone||''}</td><td>${x.email||''}</td><td>${x.source||''}</td><td>${x.creator||''}</td><td>${x.createdAt||''}</td><td>${x.updatedAt||''}</td><td><a href='shop-draft-edit.html?id=${x.id}'>编辑</a></td></tr>`).join('')||'<tr><td colspan="16">暂无草稿</td></tr>';}renderGlobalSidebar('appSidebar','shop-draft-list.html');render();</script></body></html>
