<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>商铺草稿列表</title><link rel="stylesheet" href="assets/styles.css"/></head><body><header class="shell-top"><div class="logo-area"><div class="logo">K</div><a href="shop-list.html">Kpay CRM</a></div></header><div class="layout"><aside class="sidebar" id="appSidebar"></aside><main class="main"><section class="card"><h3 class="section-title">筛选区</h3><div class="grid-3"><div class="field"><label>商铺名称关键词</label><input id="name"/></div><div class="field"><label>地区</label><select id="region"><option value="">全部</option><option>香港</option><option>新加坡</option><option>澳门</option></select></div></div><div class="btns"><button class="btn primary" onclick="render()">查询</button></div></section><section class="card"><h3 class="section-title">列表区（最多50条）</h3><div class="table-wrap"><table><thead><tr><th>商铺名称</th><th>商铺编号</th><th>所属企业名称</th><th>所属企业编号（CID）</th><th>地区</th><th>服务通道</th><th>商铺类型</th><th>经营模式</th><th>MCC Code</th><th>商铺电话</th><th>管理员电邮</th><th>上單來源</th><th>创建人</th><th>创建时间</th><th>更新时间</th><th>操作</th></tr></thead><tbody id="tb"></tbody></table></div></section></main></div><script src="assets/app.js"></script><script>const K='draft_shop_v1';function get(){return JSON.parse(localStorage.getItem(K)||'[]')}function render(){const n=document.getElementById('name').value.toLowerCase();const r=document.getElementById('region').value;const rows=get().filter(x=>(!n||((x.name||'').toLowerCase().includes(n)))&&(!r||x.region===r));document.getElementById('tb').innerHTML=rows.map(x=>`<tr><td>${x.name||''}</td><td>${x.id||''}</td><td>${x.enterpriseName||''}</td><td>${x.cid||''}</td><td>${x.region||''}</td><td>${x.service||''}</td><td>${x.type||''}</td><td>${x.mode||''}</td><td>${x.mcc||''}</td><td>${x.phone||''}</td><td>${x.email||''}</td><td>${x.source||''}</td><td>${x.creator||''}</td><td>${x.createdAt||''}</td><td>${x.updatedAt||''}</td><td><a href='shop-draft-edit.html?id=${x.id}'>编辑</a></td></tr>`).join('')||'<tr><td colspan="16">暂无草稿</td></tr>';}renderGlobalSidebar('appSidebar','shop-draft-list.html');render();</script></body></html>
