<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>商户草稿列表</title><link rel="stylesheet" href="assets/styles.css"/></head><body><header class="shell-top"><div class="logo-area"><div class="logo">K</div><a href="merchant-list.html">Kpay CRM</a></div></header><div class="layout"><aside class="sidebar" id="appSidebar"></aside><main class="main"><section class="card"><h3 class="section-title">筛选区</h3><div class="grid-3"><div class="field"><label>商户名称关键词</label><input id="name"/></div><div class="field"><label>地区</label><select id="region"><option value="">全部</option><option>香港</option><option>新加坡</option><option>澳门</option></select></div></div><div class="btns"><button class="btn primary" onclick="render()">查询</button></div></section><section class="card"><h3 class="section-title">列表区（最多50条）</h3><div class="table-wrap"><table><thead><tr><th>商户名称</th><th>MID</th><th>CID</th><th>SID</th><th>地区</th><th>渠道编码</th><th>结算币种</th><th>结算周期</th><th>创建人</th><th>创建时间</th><th>更新时间</th><th>操作</th></tr></thead><tbody id="tb"></tbody></table></div></section></main></div><script src="assets/app.js"></script><script>const K='draft_merchant_v1';function get(){return JSON.parse(localStorage.getItem(K)||'[]')}function render(){const n=document.getElementById('name').value.toLowerCase();const r=document.getElementById('region').value;const rows=get().filter(x=>(!n||((x.name||'').toLowerCase().includes(n)))&&(!r||x.region===r));document.getElementById('tb').innerHTML=rows.map(x=>`<tr><td>${x.name||''}</td><td>${x.id||''}</td><td>${x.cid||''}</td><td>${x.sid||''}</td><td>${x.region||''}</td><td>${x.channel||''}</td><td>${x.currency||''}</td><td>${x.cycle||''}</td><td>${x.creator||''}</td><td>${x.createdAt||''}</td><td>${x.updatedAt||''}</td><td><a href='merchant-draft-edit.html?id=${x.id}'>编辑</a></td></tr>`).join('')||'<tr><td colspan="12">暂无草稿</td></tr>';}renderGlobalSidebar('appSidebar','merchant-draft-list.html');render();</script></body></html>
