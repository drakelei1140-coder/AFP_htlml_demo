urn "<input type='date'/>";if(/政策|原因|备注|備註|所有名称|所有名稱|地址/.test(k))return "<textarea rows='2'></textarea>";if(/国家|地区|类型|身份|语言|状态|方式|分类|服务|來源|来源|品牌|周期|币种|銀行|银行|角色|行业|法律地位/.test(k))return "<select><option>请选择</option></select>";return "<input/>"}

function midSettleTemplate(m,i){const mode=m.settleMode||'inherit';const hide=mode!=='independent';return `<div class='sub'><div class='shop-h'><h5>结算与银行信息区</h5><select data-mid-settle-mode='${i}'><option value='inherit' ${mode==='inherit'?'selected':''}>沿用商铺结算与银行信息</option><option value='independent' ${mode==='independent'?'selected':''}>独立编辑结算与银行信息</option></select></div><div class='form-grid ${hide?'hidden':''}'><div class='field'><label class='req'>結算週期</label><input /></div><div class='field'><label class='req'>結算幣種</label><input /></div><div class='field'><label class='req'>NP結算週期</label><input /></div><div class='field'><label class='req'>打款銀行</label><input /></div><div class='field'><label class='req'>FPS賬號</label><input class='account-field' /></div><div class='field'><label class='req'>收款銀行賬戶名稱</label><input /></div><div class='field'><label class='req'>銀行名稱</label><input /></div><div class='field'><label class='req'>銀行號碼</label><input class='code-field' /></div><div class='field'><label class='req'>銀行編號</label><input class='code-field' /></div><div class='field'><label>結算摘要前綴</label><input /></div><div class='field'><label class='req'>卡類型</label><input /></div><div class='field'><label>結算身份證號</label><input class='code-field' /></div><div class='field'><label>銀行卡歸屬國</label><input /></div><div class='field'><label>銀行卡歸屬省</label><input /></div><div class='field'><label>一份銀行戶口月結單（最近三個月內銀行發出的）</label><input type='file' /></div><div class='field'><label>FPS-DBS 申請文件</label><input type='file' /></div></div></div>`}
function midRateTemplate(){const rows=[['Visa','借记卡-境外'],['Visa','贷记卡-境外'],['Visa','借记卡-境内'],['Visa','贷记卡-境内'],['Mastercard','借记卡-境外'],['Mastercard','贷记卡-境外'],['Mastercard','借记卡-境内'],['Mastercard','贷记卡-境内'],['UnionPay','借记卡-境外'],['UnionPay','贷记卡-境外'],['UnionPay','借记卡-境内'],['UnionPay','贷记卡-境内']];return `<div class='sub'><h5>产品费率区</h5><p class='help'>固定 12 行结构，不允许增删行。</p><div class='table-wrap'><table><thead><tr><th>支付产品</th><th>类型</th><th>交易费率（百分比）</th><th>固定收费-百分比</th><th>固定收费-绝对值</th><th>开关</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td><input /></td><td><input /></td><td><input /></td><td><select><option>开</option><option>关</option></select></td></tr>`).join('')}</tbody></table></div></div>`}
function renderMidCards(shop){if(!shop.mids?.length)return "<p class='muted'>暂无 MID，请点击“新增 MID”。</p>";return shop.mids.map((m,i)=>`<div class='shop-card' style='margin:8px 0;'><div class='shop-h'><h5>MID 卡片 ${i+1}（${m.id}）</h5><span class='muted'>通道：${(m.channels||[]).join('、')}</span><div class='inline-actions'>${i>0?`<button class='btn' data-mid-copy='${i}'>复制MID数据</button>`:''}<button class='btn' data-mid-del='${i}'>删除 MID</button></div></div>${midSettleTemplate(m,i)}${midRateTemplate()}</div>`).join('')}
function renderShopDynamic(shop){if(!shop.services.length)return '';let html='';if(shop.services.includes('SaaS'))html+=renderServiceSections('saas');if(shop.services.includes('payment'))html+=renderServiceSections('payment')+`<div class='sub'><h4>商户（MID）信息区</h4><button class='btn' data-mid-add='1'>新增 MID</button><p class='muted'>当前商铺已选择 payment 服务，请新增至少一个 MID。</p>${renderMidCards(shop)}</div>`;if(shop.services.includes('SaaS')||shop.services.includes('payment'))html+=renderDeviceSection(shop)+peopleSection('shop',shop);return html;}
function openExistingPeopleModal(type,shopId=''){activeExistingPeopleType=type;activeExistingPeopleShop=shopId;['personIdKeyword','personNameKeyword','personPhoneKeyword','personEmailKeyword'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});renderExistingPeopleRows();document.getElementById('personModal').style.display='flex';}

function onShopServiceToggle(e){const sid=getShopIdFromTarget(e.target);const shop=state.shops.find(x=>x.id===sid);if(!shop)return;const svc=e.target.dataset.svc;const enterpriseSvcs=getServices();if(e.target.checked && !enterpriseSvcs.includes(svc)){const ok=confirm(`当前商铺选择了【${svc}】服务，但所属企业尚未开通该服务。\n是否同步为企业增加【${svc}】服务？`);if(ok){const entBox=[...document.querySelectorAll('#f_services input[type=checkbox]')].find(x=>x.value===svc);if(entBox){entBox.checked=true;renderDynamic();document.getElementById('entStatus').textContent='需重新保存草稿';state.enterpriseDraftSaved=false;document.getElementById('addShopBtn').disabled=true;alert('企业服务已同步增加，请重新保存企业草稿。');}}else{e.target.checked=false;return;}}

function onShopAction(e){const sid=getShopIdFromTarget(e.target);const idx=state.shops.findIndex(x=>x.id===sid);if(e.target.dataset.act==='del'){state.shops.splice(idx,1);renderShops();return;}if(e.target.dataset.act==='toggle'){state.shops[idx].collapsed=!state.shops[idx].collapsed;renderShops();return;}if(e.target.dataset.act==='save'){state.shops[idx].saved=true;alert('商铺草稿保存成功（演示提示）：后续会流转到企业草稿管理页面。');renderShops();return;}if(e.target.dataset.openDevice){openDeviceModal(sid);return;}if(e.target.dataset.deviceDel!==undefined){state.shops[idx].devices.splice(Number(e.target.dataset.deviceDel),1);renderShops();return;}if(e.target.dataset.k){const di=Number(e.target.dataset.deviceIdx);const key=e.target.dataset.k;state.shops[idx].devices[di][key]=e.target.value;renderShops();return;}if(e.target.dataset.midAdd){activeMidShop=sid;const shop=state.shops[idx];const used=new Set((shop.mids||[]).flatMap(m=>m.channels||[]));document.querySelectorAll('.mid-channel').forEach(c=>{c.checked=false;c.disabled=used.has(c.value);});document.getElementById('midChannelModal').style.display='flex';return;}if(e.target.dataset.midDel!==undefined){state.shops[idx].mids.splice(Number(e.target.dataset.midDel),1);renderShops();return;}if(e.target.dataset.midCopy!==undefined){const mi=Number(e.target.dataset.midCopy);const shop=state.shops[idx];const base=shop.mids?.[0];const target=shop.mids?.[mi];if(base&&target){target.channels=[...(base.channels||[])];target.settleMode=base.settleMode||'inherit';}renderShops();return;}if(e.target.dataset.personAdd){openPeopleModal('shop',sid);return;}if(e.target.dataset.personChoose){openExistingPeopleModal('shop',sid);return;}if(e.target.dataset.personDel!==undefined&&e.target.dataset.ptype==='shop'){state.shops[idx].people=state.shops[idx].people||[];state.shops[idx].people.splice(Number(e.target.dataset.personDel),1);renderShops();return;}}

lementById('p_id_image').files?.[0]?.name)||'';person.idIssueDate=document.getElementById('p_id_issue_date').value.trim();person.visaCountry=document.getElementById('p_visa_country').value.trim();person.visaPlace=document.getElementById('p_visa_place').value.trim();}if(role==='联络人'){const required=['p_contact_department','p_contact_title','p_contact_language'];for(const id of required){if(!(document.getElementById(id)?.value||'').trim()){alert('当前角色需填写联络人扩展信息');return;}}person.contactDepartment=document.getElementById('p_contact_department').value.trim();person.contactTitle=document.getElementById('p_contact_title').value.trim();person.contactLanguage=document.getElementById('p_contact_language').value.trim();}if(activePeopleType==='enterprise'){state.enterprisePeople.push(person);document.getElementById('peopleModal').style.display='none';renderDynamic();return;}const shop=state.shops.find(x=>x.id===activePeopleShop);if(shop){shop.people=shop.people||[];shop.people.push(person);document.getElementById('peopleModal').style.display='none';renderShops();}});

.step-tab.disabled{opacity:.55;cursor:not-allowed}
#tag-shop.disabled-mask{position:relative}
#tag-shop.disabled-mask:after{content:'请先完成企业信息暂存/确认';position:absolute;inset:0;background:rgba(255,255,255,.72);display:flex;align-items:center;justify-content:center;color:var(--danger);font-weight:600;border-radius:10px}
.shop-mini-card{border:1px solid var(--border);border-radius:12px;padding:12px;margin:10px 0;background:#fff;cursor:pointer;transition:.2s}
.shop-mini-card:hover{border-color:var(--primary);box-shadow:0 8px 20px rgba(0,0,0,.06)}
.shop-mini-grid{display:grid;grid-template-columns:1fr auto;gap:8px}
.drawer-mask{position:fixed;inset:0;background:rgba(17,24,39,.32);display:none;z-index:1400}
.drawer{position:fixed;right:0;top:0;bottom:0;width:66.666vw;max-width:66.666vw;background:#fff;border-left:1px solid var(--border);display:flex;flex-direction:column}
.drawer-h{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.drawer-b{padding:14px 16px;overflow-y:auto;flex:1}
.drawer-f{padding:12px 16px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
#tag-shop>.btns{display:none}
.modal-mask{z-index:1800!important}
</style>
<script>
(()=> {
  const main=document.querySelector('main.main');
  const enterpriseCard=main.querySelector('section.card');
  const shopGate=document.getElementById('shopGate');
  enterpriseCard.id='tag-enterprise';
  shopGate.id='tag-shop';
  shopGate.classList.remove('hidden');
  const tabs=document.createElement('div');
  tabs.className='step-tabs';
  tabs.innerHTML=`<button class="step-tab active" data-step="enterprise">Step 1 企业信息</button><button class="step-tab disabled" data-step="shop">Step 2 商铺信息</button>`;
  main.insertBefore(tabs, enterpriseCard);
  const tagShop=document.getElementById('tag-shop');
  tagShop.classList.add('disabled-mask');
  let currentStep='enterprise', editingShopId='';
  function switchStep(step){
    currentStep=step;
    enterpriseCard.style.display=step==='enterprise'?'block':'none';
    tagShop.style.display=step==='shop'?'block':'none';
    tabs.querySelectorAll('.step-tab').forEach(b=>b.classList.toggle('active',b.dataset.step===step));
  }
  tabs.addEventListener('click',(e)=>{
    const t=e.target.closest('.step-tab'); if(!t) return;
    if(t.dataset.step==='shop' && !state.enterpriseDraftSaved) return;
    switchStep(t.dataset.step);
  });
  const drawerMask=document.createElement('div');
  drawerMask.className='drawer-mask';
  drawerMask.id='shopDrawerMask';
  drawerMask.innerHTML=`<aside class="drawer"><div class="drawer-h"><strong id="drawerTitle">新增商铺</strong><div style="display:flex;gap:8px;align-items:center;"><button class="btn" id="copyEnterpriseInfoBtn">从企业信息复制</button><button class="btn" id="closeDrawerBtn">关闭</button></div></div><div class="drawer-b" id="drawerBody"></div><div class="drawer-f"><button class="btn" id="drawerStashBtn">暂存</button><button class="btn primary" id="drawerConfirmBtn">确认</button></div></aside>`;
  document.body.appendChild(drawerMask);
  function openDrawerByShop(id){
    editingShopId=id;
    const host=document.getElementById('drawerBody');
    const shop=state.shops.find(s=>s.id===id);
    document.getElementById('drawerTitle').textContent=`商铺信息 - ${id}`;
    host.innerHTML=`<div id="drawerShopHost"></div>`;
    const origin=document.getElementById('shopCards');
    const tmp=document.createElement('div');
    tmp.innerHTML=origin.innerHTML;
    const card=tmp.querySelector(`[data-shop="${id}"]`);
    if(card){
      const actions=card.querySelector('.shop-actions'); if(actions) actions.remove();
      host.querySelector('#drawerShopHost').appendChild(card);
    }
    const activeShop=state.shops.find(x=>x.id===id);
    if(activeShop){
      const svcChecks=host.querySelectorAll('[data-svc]');
      svcChecks.forEach(x=>x.checked=activeShop.services.includes(x.dataset.svc));
    }
    drawerMask.style.display='block';
  }
  window.__openShopDrawer=openDrawerByShop;
  function closeDrawer(){drawerMask.style.display='none';editingShopId='';}
  document.getElementById('closeDrawerBtn').onclick=closeDrawer;
  document.getElementById('copyEnterpriseInfoBtn').onclick=()=>{
    if(!editingShopId){alert('请先新增或打开一个商铺。');return;}
    const shop=state.shops.find(x=>x.id===editingShopId);
    if(!shop)return;
    shop.name=shop.name||document.getElementById('f_display_name').value||'示例企业名称（已复制）';
    shop.phone=shop.phone||document.getElementById('f_company_phone').value||'852-66668888';
    shop.addr=shop.addr||`${document.getElementById('f_region').value||'中国香港'} 中环德辅道中 88 号`;
    renderShops();
    openDrawerByShop(editingShopId);
    alert('已从企业信息复制企业名称、联系方式、地址到商铺信息（演示）。');
  };
  drawerMask.addEventListener('click',(e)=>{if(e.target===drawerMask)closeDrawer();});
  document.getElementById('drawerStashBtn').onclick=()=>{if(!editingShopId)return;const i=state.shops.findIndex(s=>s.id===editingShopId);if(i>=0){state.shops[i].saved=true;renderShops();closeDrawer();}};
  document.getElementById('drawerConfirmBtn').onclick=()=>{if(!editingShopId)return;const i=state.shops.findIndex(s=>s.id===editingShopId);if(i>=0){state.shops[i].saved=true;renderShops();closeDrawer();}};
  drawerMask.addEventListener('input',(e)=>{
    if(!editingShopId) return;
    const key=e.target.dataset.bind;
    if(!key) return;
    const s=state.shops.find(x=>x.id===editingShopId);
    if(!s) return;
    s[key]=e.target.value;
    renderShops();
  });
  drawerMask.addEventListener('change',(e)=>{
    if(!editingShopId) return;
    if(e.target.matches('[data-svc]')){
      onShopServiceToggle({target:e.target});
      openDrawerByShop(editingShopId);
      return;
    }
    if(e.target.matches('[data-mid-settle-mode]')){
      const sid=getShopIdFromTarget(e.target);
      const shop=state.shops.find(x=>x.id===sid);
      if(!shop)return;
      const mi=Number(e.target.dataset.midSettleMode);
      if(!shop.mids||!shop.mids[mi])return;
      shop.mids[mi].settleMode=e.target.value;
      renderShops();
      openDrawerByShop(editingShopId);
    }
  });
  drawerMask.addEventListener('click',(e)=>{
    const t=e.target.closest('[data-act],[data-open-device],[data-device-del],[data-mid-add],[data-mid-del],[data-mid-copy],[data-person-add],[data-person-del],[data-person-choose]');
    if(!t) return;
    onShopAction({target:t});
    if(editingShopId) openDrawerByShop(editingShopId);
  });
  goNext=function(status,isDraft){
    document.getElementById('entStatus').textContent=status;
    document.getElementById('submitBtn').disabled=true;
    state.enterpriseDraftSaved=isDraft;
    document.getElementById('addShopBtn').disabled=!isDraft;
    if(isDraft){
      tabs.querySelector('[data-step="shop"]').classList.remove('disabled');
      tagShop.classList.remove('disabled-mask');
      switchStep('shop');
    }
  };
  createShop=function(){if(!state.enterpriseDraftSaved){alert('请先保存企业草稿后再新增商铺。');return;}const id='SHOP-TMP-'+(state.shops.length+1);state.shops.push({id,services:[],saved:false,collapsed:false,devices:[],mids:[]});renderShops();openDrawerByShop(id);};
  renderShops=function(){
    const host=document.getElementById('shopCards');
    host.innerHTML=state.shops.map((s,idx)=>`<article class="shop-mini-card" data-shop-open="${s.id}"><div class="shop-mini-grid"><div><strong>商铺 ${idx+1}：${s.name||s.id}</strong><div class="muted">地址：${s.addr||'未填写'}</div><div class="muted">电话：${s.phone||'未填写'}</div></div><div style="display:flex;gap:8px;align-items:center;"><span class="pill">${s.saved?'已保存':'未保存'}</span><button class="btn" data-shop-del="${s.id}">删除</button></div></div></article><div class="hidden"><div class='shop-card' data-shop='${s.id}'><div><div class='form-grid'><div class='field'><label class='req'>所属企业</label><input value='${state.enterpriseDraftId}' readonly></div><div class='field'><label class='req'>商铺名称</label><input data-bind='name' value='${s.name||''}'></div><div class='field'><label class='req'>门店类型</label><select><option>线下门店</option><option>线上店</option><option>混合</option></select></div><div class='field'><label class='req'>商铺营业状态</label><select><option>营业中</option><option>停业</option></select></div><div class='field'><label class='req'>营业国家</label><input value='${document.getElementById('f_region').value||''}'></div><div class='field'><label class='req'>营业地区</label><input></div><div class='field'><label class='req'>门店地址-城市</label><input></div><div class='field'><label class='req'>门店地址-地址行1</label><input data-bind='addr' value='${s.addr||''}'></div><div class='field'><label>门店地址-地址行2</label><input></div><div class='field'><label>门店地址-地址行3</label><input></div><div class='field'><label>邮政编码</label><input></div><div class='field'><label class='req'>商铺固定电话</label><div class='phone-split'><input class='area' readonly value='${getSelectedRegionDialCode()}'><input data-bind='phone' value='${s.phone||''}'></div></div><div class='field'><label class='req'>商铺手提电话</label><div class='phone-split'><input class='area' readonly value='${getSelectedRegionDialCode()}'><input></div></div><div class='field'><label class='req'>商铺电邮地址</label><input></div><div class='field'><label class='req'>销售人员</label><select><option>请选择销售人员</option><option>张伟（S001）</option><option>李敏（S002）</option><option>王强（S003）</option></select></div></div><div class='sub'><label class='req'>开通KPay服务</label><div class='svc-row'><label><input type='checkbox' data-svc='SaaS' ${s.services.includes('SaaS')?'checked':''}/> SaaS</label><label><input type='checkbox' data-svc='payment' ${s.services.includes('payment')?'checked':''}/> payment</label><label><input type='checkbox' data-svc='KBA' ${s.services.includes('KBA')?'checked':''}/> KBA</label></div></div>${renderShopDynamic(s)}</div></div></div>`).join('');
    updateSummary();
  };
  document.getElementById('shopCards').addEventListener('click',(e)=>{
    const del=e.target.closest('[data-shop-del]');
    if(del){
      state.shops=state.shops.filter(x=>x.id!==del.dataset.shopDel);
      renderShops();
      return;
    }
    const c=e.target.closest('[data-shop-open]');if(!c)return;openDrawerByShop(c.dataset.shopOpen);
  });
  document.getElementById('shopCards').addEventListener('input',(e)=>{const box=e.target.closest('[data-shop]');if(!box)return;const sid=box.dataset.shop;const s=state.shops.find(x=>x.id===sid);if(!s)return;const k=e.target.dataset.bind;if(k)s[k]=e.target.value;});
  switchStep('enterprise');
})();
</script></body></html>
