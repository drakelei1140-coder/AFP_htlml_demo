<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>快速创建客户（联合新建）</title><link rel="stylesheet" href="assets/styles.css"/>
<style>.hidden{display:none}.card-h{display:flex;justify-content:space-between;align-items:center}.sub{border:1px solid var(--border);border-radius:8px;background:#fff;padding:10px;margin:10px 0}.pill{font-size:12px;padding:2px 8px;border:1px solid var(--border);border-radius:999px}.warn{color:var(--danger);background:var(--danger-soft);border:1px solid color-mix(in srgb,var(--danger) 35%,white);padding:8px;border-radius:6px}.req:after{content:' *';color:var(--danger)}.progress{display:flex;gap:8px;flex-wrap:wrap}.step{padding:6px 10px;border:1px solid var(--border);border-radius:999px;background:var(--panel-2)}.step.active{background:var(--primary-soft)} #f_services{display:flex;gap:16px;align-items:center;min-height:34px;flex-wrap:wrap} #f_services label{display:inline-flex;align-items:center;gap:6px;margin:0;color:var(--text)} #f_services input[type="checkbox"]{width:14px;height:14px;margin:0} #enterprisePeopleTable input[type="radio"]{width:14px;height:14px;transform:scale(.85);margin:0 auto;display:block}.shop-card{border:1px solid var(--border);border-radius:8px;padding:12px;margin:12px 0;background:#fff}.shop-head{display:flex;justify-content:space-between;align-items:center}.muted{color:var(--muted);font-size:12px}.shop-services label{margin-right:12px}.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:1200}.modal{width:min(520px,calc(100vw - 24px));background:var(--panel);border:1px solid var(--border);border-radius:10px}.modal-hd,.modal-ft{padding:10px 12px;border-bottom:1px solid var(--border)}.modal-ft{border-bottom:0;border-top:1px solid var(--border);text-align:right}.modal-bd{padding:12px}</style></head>
<body><header class="shell-top"><div class="logo-area"><div class="logo">K</div><a href="enterprise-list.html">Kpay CRM</a></div></header><div class="layout"><aside class="sidebar" id="appSidebar"></aside><main class="main with-bottom-space">
<section class="sticky-nav"><div class="progress"><span class="step active">1.企业阶段</span><span class="step" id="shopStep">2.商铺阶段</span><span class="step">3.商户阶段</span></div></section>
<section class="card"><div class="card-h"><h3 class="section-title">企业基础信息卡片</h3><span class="pill" id="entStatus">未保存</span></div>
<div class="sub"><div class="form-grid">
<div class="field"><label class="req">企业主显示名称</label><input id="f_display_name"/></div><div class="field"><label class="req">企业类型</label><input id="f_ent_type"/></div>
<div class="field"><label class="req">注册国家 / 地区</label><input id="f_region"/></div><div class="field"><label class="req">企业营业状态</label><select id="f_biz_status"><option selected>营业中</option><option>停业</option></select></div>
<div class="field"><label class="req">公司电话</label><input id="f_company_phone"/></div><div class="field"><label class="req">手提电话</label><input id="f_mobile_phone"/></div>
<div class="field"><label class="req">电邮地址</label><input id="f_email"/></div><div class="field"><label class="req">开通Kpay服务</label><div id="f_services"><label><input type="checkbox" value="SaaS" onchange="renderDynamic()"/> SaaS</label><label><input type="checkbox" value="payment" onchange="renderDynamic()"/> payment</label><label><input type="checkbox" value="信贷" onchange="renderDynamic()"/> 信贷</label></div></div>
</div></div>
<div id="dynamicFields" class="hidden"></div>
<div class="btns"><button class="btn" onclick="stashEnterprise()">暂存</button><button class="btn primary" onclick="confirmEnterprise()">确认</button><button class="btn">取消</button></div>
<div class="desc">确认：不生成草稿ID；暂存：生成草稿ID。两者都可进入商铺阶段。</div><div class="warn hidden" id="errorBox"></div></section>
<section class="card hidden" id="shopGate"><div class="card-h"><h3 class="section-title">商铺信息区域（已开放）</h3><button class="btn" id="addShopBtn">新增商铺</button></div><div class="desc">企业状态满足进入条件后展示此区域。商铺服务与企业服务组件独立。</div><div id="shopList"></div></section>
</main></div>
<div class="modal-mask" id="svcModal"><div class="modal"><div class="modal-hd"><strong>企业服务联动确认</strong></div><div class="modal-bd" id="svcModalText"></div><div class="modal-ft"><button class="btn" id="svcNo">否</button><button class="btn primary" id="svcYes">是</button></div></div></div>
<div class="bottom-actions"><button class="btn">取消</button><button class="btn">保存全部草稿</button><button class="btn primary" disabled id="submitBtn">提交审核（企业阶段未完成）</button></div>
<script src="assets/app.js"></script><script>
renderGlobalSidebar('appSidebar','joint-create.html');applyBrandPaletteFromLogo();
const state={mode:'none',services:[],shops:[],pending:null};
const fields={
 SaaS:[['企业名称',['企业当地语言名称*','企业英文名称','企业简称']],['企业地址',['企业注册国家*','企业注册地址-城市*','企业注册地址-街道*','企业注册地址-补充地址','企业注册地址-邮编']],['企业联系',['公司电话*','手提电话*','电邮地址*','管理员电邮','运营电邮']],['相关人员',['人员名称*','角色身份类型*','是否主联系人*','联系电话*','电邮地址*']]],
 credit:[['企业主体/经营',['公司模式','公司结构','法律地位','雇员人数','注册资本','成立日期','经营年限']],['企业基础',['预计年销售额','平均每月营业额','每宗交易平均金额','预计每年交易宗数']],['风控/业务',['风控类型','风险等级','风险评估报告','是否高额商户']],['企业证件',['商业登记证号码','商业登记证名称','证书有效期','商业登记证副本照片','公司注册证明书']],['企业文件',['财务报表文件','企业架构文件','其它文件']],['企业联系',['公司电话*','手提电话*','电邮地址*','管理员电邮']],['相关人员',['人员名称','角色身份类型','是否主联系人','联系电话','电邮地址']]],
 payment:[['主要数据',['企业类型*','企业营业状态*','关联群组','企业启用状态*','企业审核状态']],['企业名称',['企业当地语言名称*','企业当地语言简称','企业英文名称*','企业英文简称','企业第三语言名称','企业第三语言简称','企业其它名称','企业所有名称（当地语言）','企业所有名称（英文）']],['企业地址',['企业注册国家*','企业注册地址-城市*','企业注册地址-邮编','企业注册地址-州/省','企业注册地址-街道*','企业注册地址-补充地址','注册办事处地址（当地语言）','注册办事处地址（英文）','邮寄地址']],['企业主体 / 经营',['公司模式*','是否子公司','公司结构','行业分类*','业务性质*','产品服务*','法律地位*','企业治理法律所在国','企业税务申报分类','企业税务业务类型','公司层级','雇员人数','注册资本']],['企业基础 / 交易信息',['预计年销售额*','每宗交易平均金额*','每宗交易最大交易额*','预计每年交易宗数*','过往拒付比例','拒付平均处理日数','过往退款比例','退款平均处理日数','平均每月营业额*','经营方式*','提前收款日数','货物/服务最短送达时间','货物/服务最长送达时间','退货政策','退货政策截图','财务报表审计','经营年限','T1特选商户','合约期','是否NGO','重复签约原因','官网 / App Store URL','第三方通道品牌名（渠道）/ 服务','企业税务国家','企业税号','企业税号类型','VAT号','无VAT原因','MCC Code*','成立日期']],['风控 / 业务',['风控类型*','风险等级','风险评估报告','审核类型*','上单来源*','服务类型*','合作伙伴推荐人','合作伙伴编号','交单备注','是否高额商户']],['企业联系',['公司电话*','手提电话*','电邮地址*','管理员电邮','运营电邮','接收营销资讯','微信ID']],['企业证件',['商业登记证号码*','商业登记证名称*','证书有效期*','商业登记证副本照片*','商业登记册内资料电子摘录','公司注册证号码','公司登记证名称','周年申报表有效期','公司注册证明书']],['企业文件',['商户（企业）筛查报告','周年申报表 / 法团成立表','公司章程大纲包括章程细则','财务报表文件','企业架构文件','入货单','闭路电视录像','最高交易金额的客户单据','JDM Result File','CSRSII文件','其它文件']],['线上资料',['Website(Desktop)','Website(Mobile)','APP(Android)','APP(IOS)','Facebook','Instagram','Openrice','H5经营网址','H5支付域名']],['相关人员',['人员名称*','角色身份类型*','是否主联系人*','联系电话*','电邮地址*']]]
};
function getServices(){return [...document.querySelectorAll('#f_services input[type=checkbox]:checked')].map(i=>i.value)}
function renderDynamic(){state.services=getServices();const box=document.getElementById('dynamicFields');if(!state.services.length){box.classList.add('hidden');box.innerHTML='';return;}const map=new Map();state.services.forEach(s=>{const key=s==='信贷'?'credit':s;fields[key].forEach(([m,arr])=>{if(!map.has(m))map.set(m,new Set());arr.forEach(f=>map.get(m).add(f));});});let html='';let idx=1;for(const [m,set] of map){if(m==='相关人员'){html+=`<div class='sub'><h4>${idx++}. ${m}</h4><div class='btns' style='justify-content:flex-start;margin:0 0 10px;'><button class='btn' type='button' data-action='add-person'>添加人员</button></div><div class='table-wrap'><table id='enterprisePeopleTable'><thead><tr><th>人员名称</th><th>角色类型</th><th>是否主联系人</th><th>电话</th><th>邮箱</th><th>操作</th></tr></thead><tbody id='peopleBody'><tr><td><input value='示例联系人'/></td><td><select><option>董事</option><option>负责人</option><option>联系人</option><option>管理员</option></select></td><td><select><option>是</option><option>否</option></select></td><td><input value='+852-6000-0000'/></td><td><input value='contact@example.com'/></td><td><button class='btn' type='button' data-action='delete-person'>删除</button></td></tr></tbody></table></div></div>`;} else {html+=`<div class='sub'><h4>${idx++}. ${m}</h4><div class='form-grid'>`+[...set].map(f=>`<div class='field'><label class='${f.includes('*')?'req':''}'>${f.replace('*','')}</label><input/></div>`).join('')+`</div></div>`;}}html+=`<div class='warn'>并集规则已生效；必填取并集最严格。相关人员对所有服务生效，且至少1人。</div>`;box.innerHTML=html;box.classList.remove('hidden');bindPeopleActions();}
function bindPeopleActions(){const box=document.getElementById('dynamicFields');box.onclick=(e)=>{const addBtn=e.target.closest('[data-action=add-person]');if(addBtn){const tbody=box.querySelector('#peopleBody');if(!tbody)return;const tr=document.createElement('tr');tr.innerHTML=`<td><input placeholder='人员名称'/></td><td><select><option>董事</option><option>负责人</option><option>联系人</option><option>管理员</option></select></td><td><select><option>是</option><option>否</option></select></td><td><input placeholder='+852-xxxx-xxxx'/></td><td><input placeholder='name@company.com'/></td><td><button class='btn' type='button' data-action='delete-person'>删除</button></td>`;tbody.appendChild(tr);return;}const delBtn=e.target.closest('[data-action=delete-person]');if(delBtn){const tr=delBtn.closest('tr');if(tr)tr.remove();}}}
function baseValid(){const req=['f_display_name','f_ent_type','f_region','f_company_phone','f_mobile_phone','f_email'];for(const id of req){if(!document.getElementById(id).value.trim())return '请填写基础必填字段';}if(!getServices().length)return '请至少选择一个服务';return ''}
function goNext(status){document.getElementById('entStatus').textContent=status;document.getElementById('shopGate').classList.remove('hidden');document.getElementById('shopStep').classList.add('active');document.getElementById('submitBtn').disabled=true;}
function stashEnterprise(){const e=baseValid();const eb=document.getElementById('errorBox');if(e){eb.textContent=e;eb.classList.remove('hidden');return;}eb.classList.add('hidden');goNext('已暂存（草稿ID: EC-DRAFT-'+Date.now().toString().slice(-6)+')');state.mode='stash';}
function confirmEnterprise(){const e=baseValid();const eb=document.getElementById('errorBox');if(e){eb.textContent=e;eb.classList.remove('hidden');return;}eb.classList.add('hidden');goNext('已确认（未生成草稿ID）');state.mode='confirm';}
const midFields=['渠道及服务（通道）','结算周期','结算币种','收款银行账户名称','银行名称','银行号码','FPS账号'];
function addShop(){const id='SHOP-DRAFT-'+(state.shops.length+1).toString().padStart(3,'0');state.shops.push({id,status:'未保存',services:[],mids:[],people:[{name:'',role:'店长',main:'是',phone:'',email:''}],collapsed:false});renderShops();}
function renderShops(){const box=document.getElementById('shopList');box.innerHTML=state.shops.map((s,i)=>{const hasS=s.services.includes('SaaS'),hasP=s.services.includes('payment');return `<div class='shop-card'><div class='shop-head'><strong>${s.id}</strong><span class='pill'>${s.status}</span></div>${s.collapsed?'<div class="muted">已收起</div>':`<div class='form-grid'><div class='field'><label class='req'>商铺名称</label><input/></div><div class='field'><label class='req'>门店类型</label><select><option>线下门店</option><option>线上店</option><option>混合</option></select></div><div class='field'><label class='req'>营业国家</label><input value='${document.getElementById('f_region').value||''}'/></div></div><div class='sub shop-services'><label><input type='checkbox' data-i='${i}' data-svc='SaaS' ${hasS?'checked':''}/> SaaS</label><label><input type='checkbox' data-i='${i}' data-svc='payment' ${hasP?'checked':''}/> payment</label></div>${hasS?`<div class='sub'><h4>SaaS 门店运营配置</h4><div class='warn'>以下为 SaaS 演示字段，非当前字段表正式字段</div></div>`:''}${hasP?`<div class='sub'><h4>payment 扩展字段</h4><div class='form-grid'><div class='field'><label class='req'>结算周期</label><input/></div><div class='field'><label class='req'>结算币种</label><input/></div><div class='field'><label class='req'>收款银行账户名称</label><input/></div></div></div>`:''}<div class='sub'><h4>相关人员（复用 shop-add 交互模式）</h4><button class='btn' data-act='add-person' data-i='${i}'>新增人员</button><table><thead><tr><th>姓名</th><th>角色</th><th>主联系人</th><th>电话</th><th>邮箱</th><th>操作</th></tr></thead><tbody>${s.people.map((p,pi)=>`<tr><td><input value='${p.name}'/></td><td><select><option>店长</option><option>门店联系人</option></select></td><td><select><option>是</option><option>否</option></select></td><td><input value='${p.phone}'/></td><td><input value='${p.email}'/></td><td><button class='btn' data-act='del-person' data-i='${i}' data-pi='${pi}'>删除</button></td></tr>`).join('')}</tbody></table></div>${hasP?`<div class='sub'><h4>MID 信息区（卡片）</h4><button class='btn' data-act='add-mid' data-i='${i}'>新增 MID</button>${s.mids.length?s.mids.map((m,mi)=>`<div class='sub'><div class='card-h'><strong>MID卡片 ${mi+1}</strong><button class='btn' data-act='del-mid' data-i='${i}' data-mi='${mi}'>删除</button></div><div class='form-grid'>${midFields.map(f=>`<div class='field'><label>${f}</label><input/></div>`).join('')}</div></div>`).join(''):`<div class='warn'>当前商铺已选择 payment 服务，请新增至少一个 MID。</div>`}</div>`:''}`}<div class='btns'><button class='btn' data-act='save-shop' data-i='${i}'>保存商铺草稿</button><button class='btn' data-act='del-shop' data-i='${i}'>删除商铺</button><button class='btn' data-act='toggle' data-i='${i}'>${s.collapsed?'展开':'收起'}</button></div>`}</div>`;}).join('')||'<div class="sub">暂无商铺，请点击新增商铺。</div>';
box.querySelectorAll('[data-svc]').forEach(el=>el.onchange=(e)=>toggleSvc(+e.target.dataset.i,e.target.dataset.svc,e.target.checked));
box.querySelectorAll('[data-act]').forEach(el=>el.onclick=()=>handleShopAction(el.dataset));}
function toggleSvc(i,svc,checked){const ent=getServices();if(checked&&!ent.includes(svc)){state.pending={i,svc};svcModalText.textContent=`当前商铺选择了【${svc}】服务，但所属企业尚未开通该服务。是否同步为企业增加【${svc}】服务？`;svcModal.style.display='flex';return;}const arr=state.shops[i].services;state.shops[i].services=checked?[...new Set([...arr,svc])]:arr.filter(x=>x!==svc);renderShops();}
function handleShopAction(d){const i=+d.i;if(d.act==='add-person'){state.shops[i].people.push({name:'',role:'门店联系人',main:'否',phone:'',email:''});}if(d.act==='del-person'){state.shops[i].people.splice(+d.pi,1);}if(d.act==='add-mid'){state.shops[i].mids.push({});}if(d.act==='del-mid'){state.shops[i].mids.splice(+d.mi,1);}if(d.act==='save-shop'){state.shops[i].status='已保存草稿';}if(d.act==='del-shop'){state.shops.splice(i,1);}if(d.act==='toggle'){state.shops[i].collapsed=!state.shops[i].collapsed;}renderShops();}
addShopBtn.onclick=addShop;
svcNo.onclick=()=>{state.pending=null;svcModal.style.display='none';renderShops();};
svcYes.onclick=()=>{if(state.pending){const inpt=[...document.querySelectorAll('#f_services input')].find(i=>i.value===state.pending.svc);if(inpt){inpt.checked=true;renderDynamic();}state.shops[state.pending.i].services=[...new Set([...state.shops[state.pending.i].services,state.pending.svc])];document.getElementById('entStatus').textContent='需重新保存草稿';}state.pending=null;svcModal.style.display='none';renderShops();};
</script></body></html>
