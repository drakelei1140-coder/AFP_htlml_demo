<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>快速创建客户（企业阶段）</title><link rel="stylesheet" href="assets/styles.css"/>
<style>.hidden{display:none}.card-h{display:flex;justify-content:space-between;align-items:center}.sub{border:1px solid var(--border);border-radius:8px;background:#fff;padding:10px;margin:10px 0}.pill{font-size:12px;padding:2px 8px;border:1px solid var(--border);border-radius:999px}.warn{color:var(--danger);background:var(--danger-soft);border:1px solid color-mix(in srgb,var(--danger) 35%,white);padding:8px;border-radius:6px}.req:after{content:' *';color:var(--danger)}.progress{display:flex;gap:8px;flex-wrap:wrap}.step{padding:6px 10px;border:1px solid var(--border);border-radius:999px;background:var(--panel-2)}.step.active{background:var(--primary-soft)}</style></head>
<body><header class="shell-top"><div class="logo-area"><div class="logo">K</div><a href="enterprise-list.html">Kpay CRM</a></div></header><div class="layout"><aside class="sidebar" id="appSidebar"></aside><main class="main with-bottom-space">
<section class="sticky-nav"><div class="progress"><span class="step active">1.企业阶段</span><span class="step">2.商铺阶段</span><span class="step">3.商户阶段</span></div></section>
<section class="card"><div class="card-h"><h3 class="section-title">企业基础信息卡片</h3><span class="pill" id="entStatus">未保存</span></div>
<div class="sub"><div class="form-grid">
<div class="field"><label class="req">企业主显示名称</label><input id="f_display_name"/></div><div class="field"><label class="req">企业类型</label><input id="f_ent_type"/></div>
<div class="field"><label class="req">注册国家 / 地区</label><input id="f_region"/></div><div class="field"><label class="req">企业营业状态</label><select id="f_biz_status"><option selected>营业中</option><option>停业</option></select></div>
<div class="field"><label class="req">公司电话</label><input id="f_company_phone"/></div><div class="field"><label class="req">手提电话</label><input id="f_mobile_phone"/></div>
<div class="field"><label class="req">电邮地址</label><input id="f_email"/></div><div class="field"><label class="req">开通Kpay服务</label><div id="f_services" style="display:flex;gap:12px;align-items:center;height:34px"><label><input type="checkbox" value="SaaS" onchange="renderDynamic()"/> SaaS</label><label><input type="checkbox" value="payment" onchange="renderDynamic()"/> payment</label><label><input type="checkbox" value="信贷" onchange="renderDynamic()"/> 信贷</label></div></div>
</div></div>
<div id="dynamicFields" class="hidden"></div>
<div class="btns"><button class="btn" onclick="stashEnterprise()">暂存</button><button class="btn primary" onclick="confirmEnterprise()">确认</button><button class="btn">取消</button></div>
<div class="desc">确认：不生成草稿ID；暂存：生成草稿ID。两者都可进入商铺阶段。</div><div class="warn hidden" id="errorBox"></div></section>
<section class="card hidden" id="shopGate"><h3 class="section-title">商铺信息区域（已开放）</h3><div class="desc">企业状态满足进入条件后展示此区域。</div></section>
</main></div>
<div class="bottom-actions"><button class="btn">取消</button><button class="btn">保存全部草稿</button><button class="btn primary" disabled id="submitBtn">提交审核（企业阶段未完成）</button></div>
<script src="assets/app.js"></script><script>
renderGlobalSidebar('appSidebar','joint-create.html');applyBrandPaletteFromLogo();
const state={mode:'none',services:[]};
const fields={
 SaaS:[['企业名称',['企业当地语言名称*','企业英文名称','企业简称']],['企业地址',['企业注册国家*','企业注册地址-城市*','企业注册地址-街道*','企业注册地址-补充地址','企业注册地址-邮编']],['企业联系',['公司电话*','手提电话*','电邮地址*','管理员电邮','运营电邮']],['相关人员',['人员名称*','角色身份类型*','是否主联系人*','联系电话*','电邮地址*']]],
 credit:[['企业主体/经营',['公司模式','公司结构','法律地位','雇员人数','注册资本','成立日期','经营年限']],['企业基础',['预计年销售额','平均每月营业额','每宗交易平均金额','预计每年交易宗数']],['风控/业务',['风控类型','风险等级','风险评估报告','是否高额商户']],['企业证件',['商业登记证号码','商业登记证名称','证书有效期','商业登记证副本照片','公司注册证明书']],['企业文件',['财务报表文件','企业架构文件','其它文件']],['企业联系',['公司电话*','手提电话*','电邮地址*','管理员电邮']],['相关人员',['人员名称','角色身份类型','是否主联系人','联系电话','电邮地址']]],
 payment:[['主要数据',['企业类型*','企业营业状态*','关联群组','企业启用状态*','企业审核状态']],['企业名称',['企业当地语言名称*','企业当地语言简称','企业英文名称*','企业英文简称','企业第三语言名称','企业第三语言简称','企业其它名称','企业所有名称（当地语言）','企业所有名称（英文）']],['企业地址',['企业注册国家*','企业注册地址-城市*','企业注册地址-邮编','企业注册地址-州/省','企业注册地址-街道*','企业注册地址-补充地址','注册办事处地址（当地语言）','注册办事处地址（英文）','邮寄地址']],['企业主体 / 经营',['公司模式*','是否子公司','公司结构','行业分类*','业务性质*','产品服务*','法律地位*','企业治理法律所在国','企业税务申报分类','企业税务业务类型','公司层级','雇员人数','注册资本']],['企业基础 / 交易信息',['预计年销售额*','每宗交易平均金额*','每宗交易最大交易额*','预计每年交易宗数*','过往拒付比例','拒付平均处理日数','过往退款比例','退款平均处理日数','平均每月营业额*','经营方式*','提前收款日数','货物/服务最短送达时间','货物/服务最长送达时间','退货政策','退货政策截图','财务报表审计','经营年限','T1特选商户','合约期','是否NGO','重复签约原因','官网 / App Store URL','第三方通道品牌名（渠道）/ 服务','企业税务国家','企业税号','企业税号类型','VAT号','无VAT原因','MCC Code*','成立日期']],['风控 / 业务',['风控类型*','风险等级','风险评估报告','审核类型*','上单来源*','服务类型*','合作伙伴推荐人','合作伙伴编号','交单备注','是否高额商户']],['企业联系',['公司电话*','手提电话*','电邮地址*','管理员电邮','运营电邮','接收营销资讯','微信ID']],['企业证件',['商业登记证号码*','商业登记证名称*','证书有效期*','商业登记证副本照片*','商业登记册内资料电子摘录','公司注册证号码','公司登记证名称','周年申报表有效期','公司注册证明书']],['企业文件',['商户（企业）筛查报告','周年申报表 / 法团成立表','公司章程大纲包括章程细则','财务报表文件','企业架构文件','入货单','闭路电视录像','最高交易金额的客户单据','JDM Result File','CSRSII文件','其它文件']],['线上资料',['Website(Desktop)','Website(Mobile)','APP(Android)','APP(IOS)','Facebook','Instagram','Openrice','H5经营网址','H5支付域名']],['相关人员',['人员名称*','角色身份类型*','是否主联系人*','联系电话*','电邮地址*']]]
};
function getServices(){return [...document.querySelectorAll('#f_services input[type=checkbox]:checked')].map(i=>i.value)}
function renderDynamic(){state.services=getServices();const box=document.getElementById('dynamicFields');if(!state.services.length){box.classList.add('hidden');box.innerHTML='';return;}const map=new Map();state.services.forEach(s=>{const key=s==='信贷'?'credit':s;fields[key].forEach(([m,arr])=>{if(!map.has(m))map.set(m,new Set());arr.forEach(f=>map.get(m).add(f));});});let html='';let idx=1;for(const [m,set] of map){html+=`<div class='sub'><h4>${idx++}. ${m}</h4><div class='form-grid'>`+[...set].map(f=>`<div class='field'><label class='${f.includes('*')?'req':''}'>${f.replace('*','')}</label><input/></div>`).join('')+`</div></div>`;}html+=`<div class='warn'>并集规则已生效；必填取并集最严格。相关人员对所有服务生效，且至少1人。</div>`;box.innerHTML=html;box.classList.remove('hidden');}
function baseValid(){const req=['f_display_name','f_ent_type','f_region','f_company_phone','f_mobile_phone','f_email'];for(const id of req){if(!document.getElementById(id).value.trim())return '请填写基础必填字段';}if(!getServices().length)return '请至少选择一个服务';return ''}
function goNext(status){document.getElementById('entStatus').textContent=status;document.getElementById('shopGate').classList.remove('hidden');document.getElementById('submitBtn').disabled=true;}
function stashEnterprise(){const err=baseValid();const eb=document.getElementById('errorBox');if(err){eb.textContent=err;eb.classList.remove('hidden');return;}eb.classList.add('hidden');goNext('已暂存（草稿ID: EC-DRAFT-'+Date.now().toString().slice(-6)+')');state.mode='stash';}
function confirmEnterprise(){const err=baseValid();const eb=document.getElementById('errorBox');if(err){eb.textContent=err;eb.classList.remove('hidden');return;}eb.classList.add('hidden');goNext('已确认（未生成草稿ID）');state.mode='confirm';}
</script></body></html>
