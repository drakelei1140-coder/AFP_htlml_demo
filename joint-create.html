<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>快速创建客户（联合新建）</title><link rel="stylesheet" href="assets/styles.css"/>
<style>.hidden{display:none}.card-h{display:flex;justify-content:space-between;align-items:center}.sub{border:1px solid var(--border);border-radius:8px;background:#fff;padding:10px;margin:10px 0}.pill{font-size:12px;padding:2px 8px;border:1px solid var(--border);border-radius:999px}.warn{color:var(--danger);background:var(--danger-soft);border:1px solid color-mix(in srgb,var(--danger) 35%,white);padding:8px;border-radius:6px}.req:after{content:' *';color:var(--danger)}.progress{display:flex;gap:8px;flex-wrap:wrap}.step{padding:6px 10px;border:1px solid var(--border);border-radius:999px;background:var(--panel-2)}.step.active{background:var(--primary-soft)} #f_services{display:flex;gap:16px;align-items:center;min-height:34px;flex-wrap:wrap} #f_services label{display:inline-flex;align-items:center;gap:6px}.shop-card{border:1px solid var(--border);border-radius:8px;padding:12px;margin:12px 0;background:#fff}.shop-head{display:flex;justify-content:space-between}.muted{color:var(--muted);font-size:12px}.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:1200}.modal{width:min(520px,calc(100vw - 24px));background:var(--panel);border:1px solid var(--border);border-radius:10px}.modal-hd,.modal-ft{padding:10px 12px;border-bottom:1px solid var(--border)}.modal-ft{border-bottom:0;border-top:1px solid var(--border);text-align:right}.modal-bd{padding:12px}</style></head>
<body><header class="shell-top"><div class="logo-area"><div class="logo">K</div><a href="enterprise-list.html">Kpay CRM</a></div></header><div class="layout"><aside class="sidebar" id="appSidebar"></aside><main class="main with-bottom-space">
<section class="sticky-nav"><div class="progress"><span class="step active">1.企业阶段</span><span class="step" id="shopStep">2.商铺阶段</span><span class="step">3.商户阶段</span></div></section>
<section class="card"><div class="card-h"><h3 class="section-title">企业基础信息卡片</h3><span class="pill" id="entStatus">未保存</span></div><div class="sub"><div class="form-grid"><div class="field"><label class="req">企业主显示名称</label><input id="f_display_name"/></div><div class="field"><label class="req">企业类型</label><input id="f_ent_type"/></div><div class="field"><label class="req">注册国家 / 地区</label><input id="f_region"/></div><div class="field"><label class="req">企业营业状态</label><select id="f_biz_status"><option selected>营业中</option><option>停业</option></select></div><div class="field"><label class="req">公司电话</label><input id="f_company_phone"/></div><div class="field"><label class="req">手提电话</label><input id="f_mobile_phone"/></div><div class="field"><label class="req">电邮地址</label><input id="f_email"/></div><div class="field"><label class="req">开通Kpay服务</label><div id="f_services"><label><input type="checkbox" value="SaaS"/> SaaS</label><label><input type="checkbox" value="payment"/> payment</label><label><input type="checkbox" value="信贷"/> 信贷</label></div></div></div></div><div id="enterpriseDynamic" class="hidden"></div><div class="btns"><button class="btn" onclick="stashEnterprise()">暂存</button><button class="btn primary" onclick="confirmEnterprise()">确认</button></div><div class="warn hidden" id="errorBox"></div></section>
<section class="card hidden" id="shopGate"><div class="card-h"><h3 class="section-title">商铺信息区域</h3><button class="btn" id="addShopBtn">新增商铺</button></div><div class="muted">企业草稿已保存，可创建多个商铺并单独保存草稿。</div><div id="shopList"></div><div id="shopSummary" class="muted"></div></section>
</main></div>
<div class="modal-mask" id="svcModal"><div class="modal"><div class="modal-hd"><strong>企业服务联动确认</strong></div><div class="modal-bd" id="svcModalText"></div><div class="modal-ft"><button class="btn" id="svcNo">否</button><button class="btn primary" id="svcYes">是</button></div></div></div>
<script src="assets/app.js"></script><script>
renderGlobalSidebar('appSidebar','joint-create.html');applyBrandPaletteFromLogo();
const state={entSaved:false,entServices:[],shops:[],pending:null};
const midFields=['渠道及服务（通道）','结算周期','结算币种','收款银行账户名称','银行名称','银行号码','FPS账号'];
const entServiceFields={SaaS:["企业当地语言名称*","企业注册地址-城市*","管理员电邮"],payment:["企业英文名称*","审核类型*","服务类型*","公司注册证明书"],"信贷":["公司模式","法律地位","风险等级"]};
function renderEnterpriseDynamic(){const box=document.getElementById("enterpriseDynamic");const services=getEntServices();if(!services.length){box.classList.add("hidden");box.innerHTML="";return;}let html="<div class=\'sub\'><h4>企业服务扩展字段（按企业开通Kpay服务）</h4><div class=\'form-grid\'>";services.forEach(s=>{(entServiceFields[s]||[]).forEach(f=>{html+=`<div class='field'><label class='${f.includes('*')?'req':''}'>${s} - ${f.replace('*','')}</label><input/></div>`;});});html+="</div><div class='warn'>企业服务组件与商铺服务组件独立渲染，互不共用。</div></div>";box.innerHTML=html;box.classList.remove("hidden");}

function getEntServices(){return [...document.querySelectorAll('#f_services input:checked')].map(i=>i.value)}
function baseValid(){for(const id of ['f_display_name','f_ent_type','f_region','f_company_phone','f_mobile_phone','f_email']){if(!document.getElementById(id).value.trim())return '请填写企业必填字段';}if(!getEntServices().length)return '请至少选择一个服务';return ''}
function openShopStage(status){state.entSaved=true;state.entServices=getEntServices();renderEnterpriseDynamic();document.getElementById('entStatus').textContent=status;document.getElementById('shopGate').classList.remove('hidden');document.getElementById('shopStep').classList.add('active');renderShops();}
function stashEnterprise(){const e=baseValid();if(e)return err(e);err('');openShopStage('已保存草稿（EC-DRAFT-'+Date.now().toString().slice(-6)+')')}
function confirmEnterprise(){const e=baseValid();if(e)return err(e);err('');openShopStage('已确认，待补充商铺')}
function err(t){const b=document.getElementById('errorBox');if(!t){b.classList.add('hidden');return;}b.textContent=t;b.classList.remove('hidden');}
function addShop(){if(!state.entSaved)return;const id='SHOP-DRAFT-'+(state.shops.length+1).toString().padStart(3,'0');state.shops.push({id,status:'未保存',collapsed:false,services:[],mids:[],people:[{name:'',role:'店长',main:'是',phone:'',email:''}]});renderShops()}
function renderShops(){const wrap=document.getElementById('shopList');wrap.innerHTML=state.shops.map((s,i)=>shopHtml(s,i)).join('')||'<div class="sub">暂无商铺，请点击“新增商铺”。</div>';bindShopEvents();document.getElementById('shopSummary').textContent='商铺总数：'+state.shops.length+'，已保存草稿：'+state.shops.filter(s=>s.status==='已保存草稿').length;}
function shopHtml(s,i){const hasS=s.services.includes('SaaS'),hasP=s.services.includes('payment');return `<div class='shop-card'><div class='shop-head'><strong>商铺卡片 ${i+1}（${s.id}）</strong><span class='pill'>${s.status}</span></div>${s.collapsed?'<div class="muted">已收起</div>':`<div class='form-grid'><div class='field'><label class='req'>商铺名称</label><input data-i='${i}' data-k='name'/></div><div class='field'><label class='req'>门店类型</label><select data-i='${i}' data-k='type'><option>线下门店</option><option>线上店</option><option>混合</option></select></div><div class='field'><label class='req'>商铺营业状态</label><select><option>营业中</option><option>停业</option></select></div><div class='field'><label class='req'>营业国家</label><input value='${document.getElementById('f_region').value||''}'/></div><div class='field'><label class='req'>营业地区</label><input/></div><div class='field'><label class='req'>门店地址-城市</label><input/></div><div class='field'><label class='req'>门店地址-地址行1</label><input/></div><div class='field'><label>门店地址-地址行2</label><input/></div><div class='field'><label>门店地址-地址行3</label><input/></div><div class='field'><label>邮政编码</label><input/></div><div class='field'><label class='req'>商铺固定电话</label><input/></div><div class='field'><label class='req'>商铺手提电话</label><input/></div><div class='field'><label class='req'>商铺电邮地址</label><input/></div></div><div class='sub'><label class='req'>开通服务</label><div><label><input type='checkbox' data-svc='SaaS' data-i='${i}' ${hasS?'checked':''}/> SaaS</label> <label><input type='checkbox' data-svc='payment' data-i='${i}' ${hasP?'checked':''}/> payment</label></div></div>${hasS?`<div class='sub'><h4>SaaS 门店运营配置</h4><div class='warn'>以下为 SaaS 演示字段，非当前字段表正式字段</div><div class='form-grid'><div class='field'><label>是否启用商品管理</label><select><option>否</option><option>是</option></select></div><div class='field'><label>是否启用出单服务</label><select><option>否</option><option>是</option></select></div><div class='field'><label>第三方点餐平台名称</label><input/></div></div></div>`:''}${hasP?`<div class='sub'><h4>payment 扩展字段（按商铺详情字段）</h4><div class='muted'>展示完整 payment 商铺字段模块（基础、名称、联系、地址、线上资料、文件、经营特征、终端设备、结算与银行、其他信息）。</div><div class='form-grid'><div class='field'><label class='req'>结算周期</label><input/></div><div class='field'><label class='req'>结算币种</label><input/></div><div class='field'><label class='req'>收款银行账户名称</label><input/></div><div class='field'><label class='req'>银行名称</label><input/></div><div class='field'><label class='req'>银行号码</label><input/></div><div class='field'><label>FPS账号</label><input/></div></div><h5>终端设备管理（复用新增商铺页面能力）</h5><button class='btn'>新增设备</button><table><thead><tr><th>设备型号</th><th>设备分类</th><th>数量</th><th>支付金额</th></tr></thead><tbody><tr><td colspan='4'>暂无设备</td></tr></tbody></table></div>`:''}<div class='sub'><h4>相关人员（复用 shop-add.html 模块）</h4><button class='btn' data-act='add-person' data-i='${i}'>新增人员</button><div class='table-wrap'><table><thead><tr><th>姓名</th><th>角色身份类型</th><th>是否主联系人</th><th>电话</th><th>邮箱</th><th>操作</th></tr></thead><tbody>${s.people.map((p,pi)=>`<tr><td><input value='${p.name||''}'/></td><td><select><option ${p.role==='店长'?'selected':''}>店长</option><option>门店联系人</option><option>系统管理员</option></select></td><td><select><option ${p.main==='是'?'selected':''}>是</option><option>否</option></select></td><td><input value='${p.phone||''}'/></td><td><input value='${p.email||''}'/></td><td><button class='btn' data-act='del-person' data-i='${i}' data-pi='${pi}'>删除</button></td></tr>`).join('')}</tbody></table></div></div>${hasP?`<div class='sub'><h4>MID 信息区（卡片）</h4><button class='btn' data-act='add-mid' data-i='${i}'>新增 MID</button>${s.mids.length? s.mids.map((m,mi)=>`<div class='sub'><div class='card-h'><strong>MID 卡片 ${mi+1}（${m.code}）</strong><button class='btn' data-act='del-mid' data-i='${i}' data-mi='${mi}'>删除</button></div><div class='form-grid'>${midFields.map(f=>`<div class='field'><label>${f}</label><input/></div>`).join('')}</div></div>`).join(''):`<div class='warn'>当前商铺已选择 payment 服务，请新增至少一个 MID。</div>`}</div>`:''}`}<div class='btns'><button class='btn' data-act='save-shop' data-i='${i}'>保存商铺草稿</button><button class='btn' data-act='del-shop' data-i='${i}'>删除商铺</button><button class='btn' data-act='toggle-shop' data-i='${i}'>${s.collapsed?'展开':'收起'}</button></div></div>`}
function bindShopEvents(){document.querySelectorAll('[data-svc]').forEach(el=>el.onchange=(e)=>toggleSvc(+e.target.dataset.i,e.target.dataset.svc,e.target.checked));document.querySelectorAll('[data-act]').forEach(btn=>btn.onclick=()=>act(btn.dataset));}
function toggleSvc(i,svc,checked){const shop=state.shops[i],prev=[...shop.services];if(checked && !state.entServices.includes(svc)){state.pending={i,svc,prev};document.getElementById('svcModalText').textContent=`当前商铺选择了【${svc}】服务，但所属企业尚未开通该服务。是否同步为企业增加【${svc}】服务？`;document.getElementById('svcModal').style.display='flex';return;}shop.services=checked?[...new Set([...shop.services,svc])]:shop.services.filter(s=>s!==svc);renderShops();}
function act(d){const i=+d.i; if(d.act==='add-person'){state.shops[i].people.push({name:'',role:'门店联系人',main:'否',phone:'',email:''});renderShops();} if(d.act==='del-person'){state.shops[i].people.splice(+d.pi,1);renderShops();} if(d.act==='add-mid'){state.shops[i].mids.push({code:'MID-DRAFT-'+(state.shops[i].mids.length+1)});renderShops();} if(d.act==='del-mid'){state.shops[i].mids.splice(+d.mi,1);renderShops();} if(d.act==='save-shop'){state.shops[i].status='已保存草稿';renderShops();} if(d.act==='del-shop'){state.shops.splice(i,1);renderShops();} if(d.act==='toggle-shop'){state.shops[i].collapsed=!state.shops[i].collapsed;renderShops();}}
document.querySelectorAll('#f_services input').forEach(el=>el.addEventListener('change',renderEnterpriseDynamic));
addShopBtn.onclick=addShop;
svcNo.onclick=()=>{if(state.pending){state.shops[state.pending.i].services=state.pending.prev;}state.pending=null;svcModal.style.display='none';renderShops();};
svcYes.onclick=()=>{if(state.pending){state.entServices=[...new Set([...state.entServices,state.pending.svc])];const entServiceInput=[...document.querySelectorAll('#f_services input')].find(el=>el.value===state.pending.svc);if(entServiceInput)entServiceInput.checked=true;document.getElementById('entStatus').textContent='需重新保存企业草稿';state.shops[state.pending.i].services=[...new Set([...state.pending.prev,state.pending.svc])];renderEnterpriseDynamic();}state.pending=null;svcModal.style.display='none';renderShops();};
</script></body></html>
