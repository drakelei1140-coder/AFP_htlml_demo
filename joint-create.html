<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>快速创建客户（企业阶段）</title><link rel="stylesheet" href="assets/styles.css"/>
<style>.hidden{display:none}.card-h{display:flex;justify-content:space-between;align-items:center}.sub{border:1px solid var(--border);border-radius:8px;background:#fff;padding:10px;margin:10px 0}.pill{font-size:12px;padding:2px 8px;border:1px solid var(--border);border-radius:999px}.warn{color:var(--danger);background:var(--danger-soft);border:1px solid color-mix(in srgb,var(--danger) 35%,white);padding:8px;border-radius:6px}.req:after{content:' *';color:var(--danger)}.progress{display:flex;gap:8px;flex-wrap:wrap}.step{padding:6px 10px;border:1px solid var(--border);border-radius:999px;background:var(--panel-2)}.step.active{background:var(--primary-soft)} #f_services{display:flex;gap:16px;align-items:center;height:34px;flex-wrap:wrap} #f_services label{display:inline-flex;align-items:center;gap:6px;margin:0;color:var(--text)} #f_services input[type="checkbox"]{width:14px;height:14px;margin:0} #enterprisePeopleTable input[type="radio"]{width:14px;height:14px;transform:scale(.85);margin:0 auto;display:block}.shop-card{border:1px solid var(--border);border-radius:10px;padding:12px;margin-top:12px}.shop-h{display:flex;justify-content:space-between;align-items:center;gap:10px}.svc-row{display:flex;gap:16px;flex-wrap:wrap}.svc-row label{display:inline-flex;align-items:center;gap:6px}.muted{color:var(--muted)}.shop-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.demo-tag{font-size:12px;padding:6px;border:1px dashed var(--border);background:var(--panel-2);border-radius:6px}.table-wrap table{min-width:980px}.table-wrap th,.table-wrap td{padding:8px;border-bottom:1px solid var(--border)}.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.38);display:none;align-items:center;justify-content:center;z-index:1300}.modal{width:min(1080px,calc(100vw - 40px));background:var(--panel);border:1px solid var(--border);border-radius:10px;box-shadow:0 12px 24px rgba(0,0,0,.12)}.modal-hd,.modal-ft{padding:12px 16px;border-bottom:1px solid var(--border)}.modal-bd{padding:12px 16px;max-height:66vh;overflow:auto}.search-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:10px}.form-grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.inline-actions{display:flex;gap:8px;flex-wrap:wrap}.help{color:var(--muted);font-size:12px;margin-top:8px}</style></head>
<body><header class="shell-top"><div class="logo-area"><div class="logo">K</div><a href="enterprise-list.html">Kpay CRM</a></div></header><div class="layout"><aside class="sidebar" id="appSidebar"></aside><main class="main with-bottom-space">
<section class="card"><div class="card-h"><h3 class="section-title">企业基础信息卡片</h3><span class="pill" id="entStatus">未保存</span></div>
<div class="sub"><div class="form-grid">
<div class="field"><label class="req">企业主显示名称</label><input id="f_display_name"/></div><div class="field"><label class="req">企业类型</label><input id="f_ent_type"/></div>
<div class="field"><label class="req">注册国家 / 地区</label><input id="f_region"/></div><div class="field"><label class="req">企业营业状态</label><select id="f_biz_status"><option selected>营业中</option><option>停业</option></select></div>
<div class="field"><label class="req">公司电话</label><input id="f_company_phone"/></div><div class="field"><label class="req">手提电话</label><input id="f_mobile_phone"/></div>
<div class="field"><label class="req">电邮地址</label><input id="f_email"/></div><div class="field"><label class="req">开通Kpay服务</label><div id="f_services"><label><input type="checkbox" value="SaaS" onchange="renderDynamic()"/> SaaS</label><label><input type="checkbox" value="payment" onchange="renderDynamic()"/> payment</label><label><input type="checkbox" value="信贷" onchange="renderDynamic()"/> 信贷</label></div></div>
</div></div>
<div id="dynamicFields" class="hidden"></div>
<div class="btns"><button class="btn" onclick="stashEnterprise()">暂存</button><button class="btn primary" onclick="confirmEnterprise()">确认</button></div>
<div class="desc">确认：不生成草稿ID；暂存：生成草稿ID。两者都可进入商铺阶段。</div><div class="warn hidden" id="errorBox"></div></section>
<section class="card hidden" id="shopGate"><div class="card-h"><h3 class="section-title">商铺信息区域（Step2）</h3><button class="btn" id="addShopBtn">新增商铺</button></div><p class="desc">仅企业草稿保存后开放。新增商铺默认只展示基础字段；服务只支持 SaaS / payment。</p><div id="shopCards"></div><div class="sub"><strong>商铺保存状态汇总：</strong><span id="shopSummary" class="muted">暂无商铺</span></div><div class="btns"><button class="btn" id="shopStashBtn">暂存</button><button class="btn primary" id="shopConfirmBtn">确认</button></div></section>
</main></div>
<div class="bottom-actions"><button class="btn">取消</button><button class="btn">保存全部草稿</button><button class="btn primary" disabled id="submitBtn">提交审核（企业阶段未完成）</button></div>

<div class="modal-mask" id="deviceModal"><div class="modal"><div class="modal-hd" style="display:flex;justify-content:space-between;align-items:center;"><strong>选择设备</strong><button class="btn" data-close="deviceModal" style="border:0;background:transparent;font-size:22px;line-height:1;padding:0 4px;">×</button></div><div class="modal-bd">
  <div class="search-grid" style="grid-template-columns:repeat(2,minmax(0,1fr));"><input id="deviceModelKeyword" placeholder="按设备型号搜索"><input id="deviceSnKeyword" placeholder="按设备序列号搜索"></div>

</div></div></div>

<script src="assets/app.js"></script><script>
renderGlobalSidebar('appSidebar','joint-create.html');applyBrandPaletteFromLogo();
const state={mode:'none',services:[],enterpriseDraftSaved:false,enterpriseDraftId:'',shops:[]};
const fields={
 SaaS:[
  ['企业名称',['企业当地语言名称*','企业英文名称','企业简称']],
  ['企业地址',['企业注册国家*','企业注册地址-城市*','企业注册地址-街道*','企业注册地址-补充地址','企业注册地址-邮编']],
  ['企业联系',['公司电话*','手提电话*','电邮地址*','管理员电邮','运营电邮']],
  ['相关人员',['人员名称*','角色身份类型*','是否主联系人*','联系电话*','电邮地址*']]
 ],
 credit:[
  ['企业主体 / 经营',['公司模式','公司结构','法律地位','雇员人数','注册资本','成立日期','经营年限']],
  ['企业经营能力',['预计年销售额','平均每月营业额','每宗交易平均金额','预计每年交易宗数']],
  ['风控信息',['风控类型','风险等级','风险评估报告']],
  ['企业证件',['商业登记证号码','商业登记证名称','证书有效期','商业登记证副本照片','公司注册证明书']],
  ['企业文件',['财务报表文件','企业架构文件','其它文件']],
  ['企业联系',['公司电话*','手提电话*','电邮地址*','管理员电邮']],
  ['相关人员',['人员名称','角色身份类型','是否主联系人','联系电话','电邮地址']]
 ],
 payment:[
  ['主要数据',['企业类型*','企业营业状态*','关联群组','企业启用状态*','企业审核状态']],
  ['企业名称',['企业当地语言名称*','企业当地语言简称','企业英文名称*','企业英文简称','企业第三语言名称','企业第三语言简称','企业其它名称','企业所有名称（当地语言）','企业所有名称（英文）']],
  ['企业地址',['企业注册国家*','企业注册地址-城市*','企业注册地址-邮编','企业注册地址-州/省','企业注册地址-街道*','企业注册地址-补充地址','注册办事处地址（当地语言）','注册办事处地址（英文）','邮寄地址']],
  ['企业主体 / 经营',['公司模式*','是否子公司','公司结构','行业分类*','业务性质*','产品服务*','法律地位*','企业治理法律所在国','企业税务申报分类','企业税务业务类型','公司层级','雇员人数','注册资本']],
  ['企业基础 / 交易信息',['预计年销售额*','每宗交易平均金额*','每宗交易最大交易额*','预计每年交易宗数*','过往拒付比例','拒付平均处理日数','过往退款比例','退款平均处理日数','平均每月营业额*','经营方式*','提前收款日数','货物/服务最短送达时间','货物/服务最长送达时间','退货政策','退货政策截图','财务报表审计','经营年限','T1特选商户','合约期','是否NGO','重复签约原因','官网 / App Store URL','第三方通道品牌名（渠道）/ 服务','企业税务国家','企业税号','企业税号类型','VAT号','无VAT原因','MCC Code*','成立日期']],
  ['风控 / 业务',['风控类型*','风险等级','风险评估报告','审核类型*','上单来源*','服务类型*','合作伙伴推荐人','合作伙伴编号','交单备注','是否高额商户']],
  ['企业联系',['公司电话*','手提电话*','电邮地址*','管理员电邮','运营电邮','接收营销资讯','微信ID']],
  ['企业证件',['商业登记证号码*','商业登记证名称*','证书有效期*','商业登记证副本照片*','商业登记册内资料电子摘录','公司注册证号码','公司登记证名称','周年申报表有效期','公司注册证明书']],
  ['企业文件',['商户（企业）筛查报告','周年申报表 / 法团成立表','公司章程大纲包括章程细则','财务报表文件','企业架构文件','入货单','闭路电视录像','最高交易金额的客户单据','JDM Result File','CSRSII文件','其它文件']],
  ['线上资料',['Website(Desktop)','Website(Mobile)','APP(Android)','APP(IOS)','Facebook','Instagram','Openrice','H5经营网址','H5支付域名']],
  ['相关人员',['人员名称*','角色身份类型*','是否主联系人*','联系电话*','电邮地址*']]
 ]
};
const paymentSections=`<div class='sub'><h4>payment 字段</h4><div class='form-grid'><div class='field'><label class='req'>店面相片</label><input type='file' accept='image/*'/></div><div class='field'><label>存仓相片</label><input type='file' accept='image/*'/></div><div class='field'><label>租金</label><input type='number'/></div><div class='field'><label class='req'>商户营业状态</label><select><option>正常营业</option><option>筹备中</option></select></div><div class='field'><label>Website(Desktop)</label><input/></div><div class='field'><label>平均每月营业额</label><input type='number'/></div><div class='field'><label class='req'>结算周期</label><select><option>T+1</option><option>T+2</option></select></div><div class='field'><label class='req'>结算币种</label><select><option>HKD</option><option>USD</option></select></div><div class='field'><label class='req'>收款银行账户名称</label><input/></div><div class='field'><label class='req'>银行名称</label><input/></div><div class='field'><label class='req'>银行号码</label><input/></div><div class='field'><label class='req'>银行卡归属国</label><select><option>中国香港</option><option>新加坡</option></select></div></div></div>`;
const saasSections=`<div class='sub'><h4>SaaS 门店运营配置</h4><div class='demo-tag'>以下为 SaaS 演示字段，非当前字段表正式字段</div><div class='form-grid'><div class='field'><label>是否启用商品管理</label><select><option>否</option><option>是</option></select></div><div class='field'><label>是否启用出单服务</label><select><option>否</option><option>是</option></select></div><div class='field'><label>是否启用桌面扫码点餐</label><select><option>否</option><option>是</option></select></div><div class='field'><label>是否对接第三方点餐平台</label><select><option>否</option><option>是</option></select></div><div class='field'><label>第三方点餐平台名称</label><input/></div></div></div><div class='sub'><h4>SaaS 相关人员</h4><div class='form-grid'><div class='field'><label class='req'>姓名</label><input/></div><div class='field'><label class='req'>角色身份类型</label><input/></div><div class='field'><label class='req'>是否主联系人</label><select><option>是</option><option>否</option></select></div><div class='field'><label class='req'>电话</label><input/></div><div class='field'><label class='req'>邮箱</label><input/></div></div></div>`;
function getServices(){return [...document.querySelectorAll('#f_services input[type=checkbox]:checked')].map(i=>i.value)}
function renderDynamic(){state.services=getServices();const box=document.getElementById('dynamicFields');if(!state.services.length){box.classList.add('hidden');box.innerHTML='';return;}const map=new Map();state.services.forEach(s=>{const key=s==='信贷'?'credit':s;fields[key].forEach(([m,arr])=>{if(!map.has(m))map.set(m,new Set());arr.forEach(f=>map.get(m).add(f));});});let html='';for(const [m,set] of map){html+=`<div class='sub'><h4>${m}</h4><div class='form-grid'>`+[...set].map(f=>`<div class='field'><label class='${f.includes('*')?'req':''}'>${f.replace('*','')}</label><input/></div>`).join('')+`</div></div>`;}html+=`<div class='warn'>并集规则已生效；必填取并集最严格。</div>`;box.innerHTML=html;box.classList.remove('hidden');}
function baseValid(){const req=['f_display_name','f_ent_type','f_region','f_company_phone','f_mobile_phone','f_email'];for(const id of req){if(!document.getElementById(id).value.trim())return '请填写基础必填字段';}if(!getServices().length)return '请至少选择一个服务';return ''}
function goNext(status,isDraft){document.getElementById('entStatus').textContent=status;document.getElementById('shopGate').classList.remove('hidden');document.getElementById('submitBtn').disabled=true;state.enterpriseDraftSaved=isDraft;document.getElementById('addShopBtn').disabled=!isDraft;}
function stashEnterprise(){document.getElementById('errorBox').classList.add('hidden');state.enterpriseDraftId='EC-DRAFT-'+Date.now().toString().slice(-6);goNext('已暂存（草稿ID: '+state.enterpriseDraftId+')',true);state.mode='stash';}
function confirmEnterprise(){document.getElementById('errorBox').classList.add('hidden');if(!state.enterpriseDraftId)state.enterpriseDraftId='EC-DRAFT-'+Date.now().toString().slice(-6);goNext('已确认（可进入商铺阶段）',true);state.mode='confirm';}
function createShop(){if(!state.enterpriseDraftSaved){alert('请先保存企业草稿后再新增商铺。');return;}const id='SHOP-TMP-'+(state.shops.length+1);state.shops.push({id,services:[],saved:false,collapsed:false,devices:[],mids:[]});renderShops();}
function renderShops(){const host=document.getElementById('shopCards');host.innerHTML=state.shops.map((s,idx)=>`<div class='shop-card' data-shop='${s.id}'><div class='shop-h'><h4>商铺卡片 ${idx+1}（${s.id}）</h4><span class='pill'>${s.saved?'已保存草稿':'未保存'}</span></div><div class='${s.collapsed?'hidden':''}'><div class='form-grid'><div class='field'><label class='req'>所属企业</label><input value='${state.enterpriseDraftId}' readonly></div><div class='field'><label class='req'>商铺名称</label><input></div><div class='field'><label class='req'>门店类型</label><select><option>线下门店</option><option>线上店</option><option>混合</option></select></div><div class='field'><label class='req'>商铺营业状态</label><select><option>营业中</option><option>停业</option></select></div><div class='field'><label class='req'>营业国家</label><input value='${document.getElementById('f_region').value||''}'></div><div class='field'><label class='req'>营业地区</label><input></div><div class='field'><label class='req'>门店地址-城市</label><input></div><div class='field'><label class='req'>门店地址-地址行1</label><input></div><div class='field'><label>门店地址-地址行2</label><input></div><div class='field'><label>门店地址-地址行3</label><input></div><div class='field'><label>邮政编码</label><input></div><div class='field'><label class='req'>商铺固定电话</label><input></div><div class='field'><label class='req'>商铺手提电话</label><input></div><div class='field'><label class='req'>商铺电邮地址</label><input></div></div><div class='sub'><label class='req'>开通服务</label><div class='svc-row'><label><input type='checkbox' data-svc='SaaS' ${s.services.includes('SaaS')?'checked':''}/> SaaS</label><label><input type='checkbox' data-svc='payment' ${s.services.includes('payment')?'checked':''}/> payment</label></div></div>${renderShopDynamic(s)}<div class='shop-actions'><button class='btn' data-act='save'>保存商铺草稿</button><button class='btn' data-act='del'>删除商铺</button><button class='btn' data-act='toggle'>${s.collapsed?'展开':'收起'}</button></div></div></div>`).join('');
 updateSummary();}

function renderDeviceSection(shop){const rows=(shop.devices||[]).map((d,i)=>`<tr><td>${d.model}</td><td>${d.category}</td><td>${d.serial}</td><td>${d.status}</td><td><input type='number' min='0' step='1' value='${d.qty}' data-device-idx='${i}' data-k='qty'></td><td><input type='number' min='0' step='0.01' value='${d.amount}' data-device-idx='${i}' data-k='amount'></td><td><button class='btn' data-device-del='${i}'>移除</button></td></tr>`).join('')||"<tr><td colspan='7'>暂无已选设备</td></tr>";const qty=(shop.devices||[]).reduce((t,d)=>t+(Number(d.qty)||0),0);const amt=(shop.devices||[]).reduce((t,d)=>t+(Number(d.amount)||0),0);return `<section class='sub'><h4 class='section-title'>终端设备</h4><div class='inline-actions'><button class='btn' data-open-device='1'>新增设备</button></div><p class='help'>新增商铺阶段仅允许加机，不提供回收设备操作。设备数量与总金额由下方明细自动汇总。</p><div class='table-wrap' style='margin-top:10px;'><table style='min-width:1100px;'><thead><tr><th>设备型号</th><th>设备分类</th><th>设备序列号</th><th>状态</th><th>数量</th><th>支付金额</th><th>操作</th></tr></thead><tbody>${rows}</tbody></table></div><div class='form-grid-3' style='margin-top:12px;'><div class='field'><label>終端數量</label><input type='number' readonly value='${qty}'></div><div class='field'><label>總金額</label><input type='text' readonly value='HKD ${amt.toFixed(2)}'></div><div class='field'><label>終端（自助場景專用）數量</label><input type='number' min='0' step='1' class='number-field'></div><div class='field'><label>配件數量</label><input type='number' min='0' step='1' class='number-field'></div><div class='field'><label>每部終端機開戶費</label><input type='number' min='0' step='0.01' class='number-field'></div><div class='field'><label>配件申請表</label><input type='file'></div><div class='field'><label>自動打印收據(卡類)</label><select><option>启用</option><option>关闭</option></select></div><div class='field'><label>自動打印收據(非卡類)</label><select><option>启用</option><option>关闭</option></select></div></div></section>`}
const devicePool=[{model:'V400m',category:'POS',serial:'SN-900001',status:'库存可分配'},{model:'A920',category:'POS',serial:'SN-900002',status:'库存可分配'},{model:'MPOS-601',category:'mPOS',serial:'SN-900003',status:'库存可分配'}];

let activeMidShop='';
function openDeviceModal(shopId){activeDeviceShop=shopId;const modal=document.getElementById('deviceModal');modal.style.display='flex';renderDeviceRows();}
function closeDeviceModal(){document.getElementById('deviceModal').style.display='none';}
function renderDeviceRows(){const shop=state.shops.find(s=>s.id===activeDeviceShop);const k1=(document.getElementById('deviceModelKeyword')?.value||'').toLowerCase();const k2=(document.getElementById('deviceSnKeyword')?.value||'').toLowerCase();const rows=devicePool.filter(d=>(!k1||d.model.toLowerCase().includes(k1))&&(!k2||d.serial.toLowerCase().includes(k2))).map(d=>{const picked=(shop.devices||[]).some(x=>x.serial===d.serial);return `<tr><td>${d.model}</td><td>${d.category}</td><td>${d.serial}</td><td>${d.status}</td><td><button class='btn' data-device-pick='${d.serial}' ${picked?'disabled':''}>${picked?'已选择':'选择'}</button></td></tr>`}).join('');document.getElementById('deviceRows').innerHTML=rows||"<tr><td colspan='5'>无可选设备</td></tr>";document.querySelectorAll('[data-device-pick]').forEach(b=>b.onclick=()=>pickDevice(b.dataset.devicePick));}
function pickDevice(serial){const shop=state.shops.find(s=>s.id===activeDeviceShop);const d=devicePool.find(x=>x.serial===serial);if(!shop.devices)shop.devices=[];if(shop.devices.some(x=>x.serial===serial))return;shop.devices.push({...d,qty:1,amount:0});renderShops();renderDeviceRows();}

function midSettleTemplate(){return `<div class='sub'><h5>结算与银行信息区</h5><div class='form-grid'><div class='field'><label class='req'>結算週期</label><input /></div><div class='field'><label class='req'>結算幣種</label><input /></div><div class='field'><label class='req'>NP結算週期</label><input /></div><div class='field'><label class='req'>打款銀行</label><input /></div><div class='field'><label class='req'>FPS賬號</label><input class='account-field' /></div><div class='field'><label class='req'>收款銀行賬戶名稱</label><input /></div><div class='field'><label class='req'>銀行名稱</label><input /></div><div class='field'><label class='req'>銀行號碼</label><input class='code-field' /></div><div class='field'><label class='req'>銀行編號</label><input class='code-field' /></div><div class='field'><label>結算摘要前綴</label><input /></div><div class='field'><label class='req'>卡類型</label><input /></div><div class='field'><label>結算身份證號</label><input class='code-field' /></div><div class='field'><label>銀行卡歸屬國</label><input /></div><div class='field'><label>銀行卡歸屬省</label><input /></div><div class='field'><label>一份銀行戶口月結單（最近三個月內銀行發出的）</label><input type='file' /></div><div class='field'><label>FPS-DBS 申請文件</label><input type='file' /></div></div></div>`}
function midRateTemplate(){const rows=[['Visa','借记卡-境外'],['Visa','贷记卡-境外'],['Visa','借记卡-境内'],['Visa','贷记卡-境内'],['Mastercard','借记卡-境外'],['Mastercard','贷记卡-境外'],['Mastercard','借记卡-境内'],['Mastercard','贷记卡-境内'],['UnionPay','借记卡-境外'],['UnionPay','贷记卡-境外'],['UnionPay','借记卡-境内'],['UnionPay','贷记卡-境内']];return `<div class='sub'><h5>产品费率区</h5><p class='help'>固定 12 行结构，不允许增删行。</p><div class='table-wrap'><table><thead><tr><th>支付产品</th><th>类型</th><th>交易费率（百分比）</th><th>固定收费-百分比</th><th>固定收费-绝对值</th><th>开关</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td><input /></td><td><input /></td><td><input /></td><td><select><option>开</option><option>关</option></select></td></tr>`).join('')}</tbody></table></div></div>`}
function renderMidCards(shop){if(!shop.mids?.length)return "<p class='muted'>暂无 MID，请点击“新增 MID”。</p>";return shop.mids.map((m,i)=>`<div class='shop-card' style='margin:8px 0;'><div class='shop-h'><h5>MID 卡片 ${i+1}（${m.id}）</h5><span class='muted'>通道：${(m.channels||[]).join('、')}</span><button class='btn' data-mid-del='${i}'>删除 MID</button></div>${midSettleTemplate()}${midRateTemplate()}</div>`).join('')}
function renderShopDynamic(shop){if(!shop.services.length)return '';let html='';if(shop.services.includes('SaaS'))html+=saasSections;if(shop.services.includes('payment'))html+=paymentSections+renderDeviceSection(shop)+`<div class='sub'><h4>商户（MID）信息区</h4><button class='btn' data-mid-add='1'>新增 MID</button><p class='muted'>当前商铺已选择 payment 服务，请新增至少一个 MID。</p>${renderMidCards(shop)}</div>`;return html;}
function onShopServiceToggle(e){const card=e.target.closest('.shop-card');const sid=card.dataset.shop;const shop=state.shops.find(x=>x.id===sid);const svc=e.target.dataset.svc;const enterpriseSvcs=getServices();if(e.target.checked && !enterpriseSvcs.includes(svc)){const ok=confirm(`当前商铺选择了【${svc}】服务，但所属企业尚未开通该服务。\n是否同步为企业增加【${svc}】服务？`);if(ok){const entBox=[...document.querySelectorAll('#f_services input[type=checkbox]')].find(x=>x.value===svc);if(entBox){entBox.checked=true;renderDynamic();document.getElementById('entStatus').textContent='需重新保存草稿';state.enterpriseDraftSaved=false;document.getElementById('addShopBtn').disabled=true;alert('企业服务已同步增加，请重新保存企业草稿。');}}else{e.target.checked=false;return;}}
 shop.services=[...card.querySelectorAll('[data-svc]:checked')].map(i=>i.dataset.svc);renderShops();}
function onShopAction(e){const card=e.target.closest('.shop-card');const sid=card.dataset.shop;const idx=state.shops.findIndex(x=>x.id===sid);if(e.target.dataset.act==='del'){state.shops.splice(idx,1);renderShops();return;}if(e.target.dataset.act==='toggle'){state.shops[idx].collapsed=!state.shops[idx].collapsed;renderShops();return;}if(e.target.dataset.act==='save'){state.shops[idx].saved=true;alert('商铺草稿保存成功（演示提示）：后续会流转到企业草稿管理页面。');renderShops();return;}if(e.target.dataset.openDevice){openDeviceModal(sid);return;}if(e.target.dataset.deviceDel!==undefined){state.shops[idx].devices.splice(Number(e.target.dataset.deviceDel),1);renderShops();return;}if(e.target.dataset.k){const di=Number(e.target.dataset.deviceIdx);const key=e.target.dataset.k;state.shops[idx].devices[di][key]=e.target.value;renderShops();return;}if(e.target.dataset.midAdd){activeMidShop=sid;document.getElementById('midChannelModal').style.display='flex';return;}if(e.target.dataset.midDel!==undefined){state.shops[idx].mids.splice(Number(e.target.dataset.midDel),1);renderShops();return;}}

document.getElementById('shopCards').addEventListener('change',(e)=>{if(e.target.matches('[data-svc]'))onShopServiceToggle(e);});
document.getElementById('shopCards').addEventListener('click',(e)=>{const t=e.target.closest('[data-act],[data-open-device],[data-device-del],[data-mid-add],[data-mid-del]');if(!t)return;onShopAction({target:t});});
document.getElementById('shopCards').addEventListener('input',(e)=>{if(!e.target.matches('[data-k]'))return;onShopAction({target:e.target});});
function updateSummary(){const total=state.shops.length,saved=state.shops.filter(s=>s.saved).length;document.getElementById('shopSummary').textContent=total?`共 ${total} 个商铺，已保存草稿 ${saved} 个。`:'暂无商铺';}
document.getElementById('addShopBtn').addEventListener('click',createShop);document.querySelector('#deviceModal [data-close=deviceModal]').addEventListener('click',closeDeviceModal);document.querySelector('#midChannelModal [data-close=midChannelModal]').addEventListener('click',()=>document.getElementById('midChannelModal').style.display='none');document.getElementById('confirmMidChannel').addEventListener('click',()=>{const channels=[...document.querySelectorAll('.mid-channel:checked')].map(x=>x.value);if(!channels.length){alert('请至少选择一个通道');return;}const shop=state.shops.find(x=>x.id===activeMidShop);if(!shop)return;shop.mids=shop.mids||[];shop.mids.push({id:'MID-TMP-'+(shop.mids.length+1),channels});document.getElementById('midChannelModal').style.display='none';document.querySelectorAll('.mid-channel').forEach(x=>x.checked=false);renderShops();});document.getElementById('shopStashBtn').addEventListener('click',()=>alert('商铺阶段暂存成功（演示）'));document.getElementById('shopConfirmBtn').addEventListener('click',()=>alert('商铺阶段确认成功（演示）'));document.getElementById('deviceModelKeyword').addEventListener('input',renderDeviceRows);document.getElementById('deviceSnKeyword').addEventListener('input',renderDeviceRows);
</script></body></html>
