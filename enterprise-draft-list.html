<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>企业草稿列表</title><link rel="stylesheet" href="assets/styles.css"/></head><body><header class="shell-top"><div class="logo-area"><div class="logo">K</div><a href="enterprise-list.html">Kpay CRM</a></div></header><div class="layout"><aside class="sidebar" id="appSidebar"></aside><main class="main"><section class="card"><h3 class="section-title">筛选区</h3><div class="grid-3"><div class="field"><label>名称关键词</label><input id="name"/></div><div class="field"><label>地区</label><select id="region"><option value="">全部</option><option>香港</option><option>新加坡</option><option>澳门</option></select></div></div><div class="btns"><button class="btn primary" onclick="render()">查询</button></div></section><section class="card"><h3 class="section-title">列表区（最多50条）</h3><div class="table-wrap"><table><thead><tr><th>企业名称</th><th>企业编号</th><th>地区</th><th>服务通道</th><th>公司模式</th><th>法律地位</th><th>公司电话</th><th>电邮地址</th><th>成立时间</th><th>创建时间</th><th>上單來源</th><th>创建人</th><th>更新时间</th><th>操作</th></tr></thead><tbody id="tb"></tbody></table></div></section></main></div><script src="assets/app.js"></script><script>const K='draft_enterprise_v1',SEED=[{id:'ECID-D-001',name:'Nova Retail Draft',region:'香港',service:'Adyen-AFP',mode:'直营',legal:'有限公司',phone:'+852-3000-1111',email:'ops@nova.com',founded:'2018-06-12',createdAt:'2026-05-01',source:'CRM',creator:'Olivia',updatedAt:'2026-05-05'},{id:'ECID-D-002',name:'Blue Harbor Draft',region:'新加坡',service:'Adyen-payfac',mode:'连锁',legal:'有限公司',phone:'+65-6777-1111',email:'risk@blue.sg',founded:'2016-08-09',createdAt:'2026-05-01',source:'DMO',creator:'Jay',updatedAt:'2026-05-04'},{id:'ECID-D-003',name:'Skyline Draft',region:'新加坡',service:'Adyen-AFP',mode:'加盟',legal:'股份有限公司',phone:'+65-6999-8888',email:'legal@skyline.com',founded:'2019-02-19',createdAt:'2026-04-30',source:'SaaS',creator:'Mina',updatedAt:'2026-05-03'},{id:'ECID-D-004',name:'Everpeak Draft',region:'香港',service:'Adyen-payfac',mode:'直营',legal:'有限公司',phone:'+852-3555-1299',email:'admin@ever.hk',founded:'2014-04-02',createdAt:'2026-04-29',source:'CRM',creator:'Aaron',updatedAt:'2026-05-02'},{id:'ECID-D-005',name:'Aster Kids Draft',region:'澳门',service:'Adyen-AFP',mode:'加盟',legal:'有限公司',phone:'+853-6222-3333',email:'support@aster.mo',founded:'2022-01-15',createdAt:'2026-04-28',source:'SaaS',creator:'Nana',updatedAt:'2026-05-01'}];function get(){const d=JSON.parse(localStorage.getItem(K)||'[]');if(!d.length){localStorage.setItem(K,JSON.stringify(SEED));return SEED;}return d;}function render(){const n=document.getElementById('name').value.toLowerCase(),r=document.getElementById('region').value;const rows=get().filter(x=>(!n||(x.name||'').toLowerCase().includes(n))&&(!r||x.region===r));document.getElementById('tb').innerHTML=rows.map(x=>`<tr><td>${x.name||''}</td><td>${x.id||''}</td><td>${x.region||''}</td><td>${x.service||''}</td><td>${x.mode||''}</td><td>${x.legal||''}</td><td>${x.phone||''}</td><td>${x.email||''}</td><td>${x.founded||''}</td><td>${x.createdAt||''}</td><td>${x.source||''}</td><td>${x.creator||''}</td><td>${x.updatedAt||''}</td><td><a href='enterprise-draft-edit.html?id=${x.id}'>编辑</a></td></tr>`).join('')||'<tr><td colspan="14">暂无草稿</td></tr>';}renderGlobalSidebar('appSidebar','enterprise-draft-list.html');render();</script></body></html>
