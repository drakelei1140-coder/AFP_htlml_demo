<!doctype html><html lang='zh-CN'><head><meta charset='UTF-8'/><meta name='viewport' content='width=device-width,initial-scale=1'/><title>商户草稿编辑</title><link rel='stylesheet' href='assets/styles.css'/><style>body{margin:0;background:var(--bg)}.draft-shell{padding:12px 12px 84px}.draft-frame{width:100%;height:calc(100vh - 84px);border:0;border-radius:8px;background:#fff}</style></head><body><div class='draft-shell'><iframe id='f' class='draft-frame' src='merchant-add.html'></iframe></div><div class='bottom-actions'><button class='btn' onclick='saveDraft()'>继续保存草稿</button><button class='btn primary' onclick='submitReview()'>提交审核</button></div><script>const K='draft_merchant_v1',L='merchant_pending_v1',id=new URLSearchParams(location.search).get('id');const list=()=>JSON.parse(localStorage.getItem(K)||'[]');const set=v=>localStorage.setItem(K,JSON.stringify(v));function row(){return list().find(x=>x.id===id)}function cap(){const a=list();if(!row()&&a.length>=50){alert('商户草稿已达50条上限');return false}return true}document.getElementById('f').addEventListener('load',()=>{const d=document.getElementById('f').contentWindow.document;d.querySelectorAll('.bottom-actions').forEach(el=>el.remove());d.querySelectorAll('.with-bottom-space').forEach(el=>el.classList.remove('with-bottom-space'));['saveDraftBtn','submitBtn'].forEach(id=>{const el=d.getElementById(id);if(el)el.remove();});const r=row();if(!r)return;const inp=d.querySelector('input[placeholder*="名称"]')||d.querySelector('input');if(inp)inp.value=r.name||'';});function saveDraft(){if(!cap())return;const a=list();const r=row()||{id:id||('DRAFT-'+Date.now()),createdAt:new Date().toISOString().slice(0,10)};r.updatedAt=new Date().toISOString().slice(0,10);const d=document.getElementById('f').contentWindow.document;r.name=(d.querySelector('input[placeholder*="名称"]')||d.querySelector('input'))?.value||r.name||'';r.region=(d.querySelector('select')||{}).value||r.region||'';const i=a.findIndex(x=>x.id===r.id);if(i>-1)a[i]=r;else a.push(r);set(a);alert('已保存草稿');}function submitReview(){const d=document.getElementById('f').contentWindow.document;const req=[...d.querySelectorAll('[required]')];for(const x of req){if(!x.value){alert('请先完成必填项');x.focus();return}}saveDraft();let a=list(),r=a.find(x=>x.id===id)||a[a.length-1];a=a.filter(x=>x.id!==r.id);set(a);const p=JSON.parse(localStorage.getItem(L)||'[]');p.push({...r,reviewStatus:'待审核'});localStorage.setItem(L,JSON.stringify(p));alert('提交审核成功');location.href='merchant-list.html';}</script></body></html>
